# ==============================================================================
# SkillHub Elite - Production Docker Compose Orchestration
# ==============================================================================

version: '3.8'

services:
  skillhub-mysql:
    image: mysql:8.0.36
    container_name: skillhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skillhub}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=150
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=128M
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - skillhub-backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  skillhub-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillhub-app
    restart: always
    depends_on:
      skillhub-mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      UPLOAD_DIR: /var/skillhub/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app-uploads:/var/skillhub/uploads
    networks:
      - skillhub-backend
      - skillhub-frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/readiness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  mysql-data:
    name: skillhub-mysql-data
  app-uploads:
    name: skillhub-uploads-data

networks:
  skillhub-backend:
    name: skillhub-backend-net
    internal: true
  skillhub-frontend:
    name: skillhub-frontend-net
