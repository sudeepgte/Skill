<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Sign Up | SkillHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <nav class="navbar">
        <a href="/" class="logo">SkillHub</a>
    </nav>

    <div class="auth-container">
        <h3>Sign up and start learning</h3>
        <hr style="margin: 1rem 0; border: none; border-bottom: 1px solid #d1d7dc;">

        <div th:if="${param.error}" class="alert">
            Email already registered.
        </div>

        <form th:action="@{/saveUser}" th:object="${user}" method="post">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" th:field="*{name}" placeholder="Full Name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="Email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-primary full-width">Sign Up</button>
        </form>

        <p style="text-align: center; margin-top: 1rem;">
            Already have an account? <a href="/login"
                style="color: var(--primary-color); font-weight: 700; text-decoration: none;">Log in</a>
        </p>
    </div>

</body>

</html>
