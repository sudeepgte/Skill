<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login | SkillHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <nav class="navbar">
        <a href="/" class="logo">SkillHub</a>
    </nav>

    <div class="auth-container">
        <h3>Log in to your account</h3>
        <hr style="margin: 1rem 0; border: none; border-bottom: 1px solid #d1d7dc;">

        <div th:if="${param.error}" class="alert">
            Invalid email and password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out.
        </div>
        <div th:if="${param.success}" class="alert alert-success">
            Registration successful! Please login.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="username" placeholder="Email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-primary full-width">Log in</button>
        </form>

        <p style="text-align: center; margin-top: 1rem;">
            Don't have an account? <a href="/register"
                style="color: var(--primary-color); font-weight: 700; text-decoration: none;">Sign up</a>
        </p>
    </div>

</body>

</html>
