# In-memory Test Database Configuration (Hermetic, fast, and sandboxed)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Razorpay Test Configuration
razorpay.key.id=rzp_test_mockKeyId123
razorpay.key.secret=mockSecretKey456
razorpay.webhook.secret=SkillHubWebhookSecret2026

# Sandbox Code Execution & Gemini Mock
skillhub.code-execution.mode=mock
gemini.api.key=mockGeminiKey
