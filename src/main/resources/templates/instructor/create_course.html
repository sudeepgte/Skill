<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Create Course | SkillHub</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body style="background-color: #f7f9fa;">

    <nav class="navbar">
        <a href="/" class="logo"><span class="logo-text">SkillHub</span></a>
        <div class="nav-actions">
            <a href="/instructor/dashboard" class="btn btn-ghost">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container" style="max-width: 800px; padding-top: 4rem;">
        <h1 style="text-align: center; margin-bottom: 2rem;">Create a New Course</h1>

        <div style="background: white; padding: 3rem; border: 1px solid #d1d7dc;">
            <form th:action="@{/instructor/courses/save}" th:object="${course}" method="post">

                <div class="form-group">
                    <label style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Course Title</label>
                    <input type="text" th:field="*{title}" placeholder="e.g. Learn Angular from Scratch" required>
                </div>

                <div class="form-group">
                    <label style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Subtitle</label>
                    <input type="text" th:field="*{subtitle}" placeholder="e.g. Master the basics and advanced concepts"
                        required>
                </div>

                <div class="form-group">
                    <label style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Category</label>
                    <select th:field="*{category.id}"
                        style="width: 100%; height: 4.8rem; padding: 0 1rem; font-size: 1.6rem; border: 1px solid #2d2f31;"
                        required>
                        <option value="">Select a category</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Price (₹)</label>
                    <input type="number" th:field="*{price}" placeholder="499" step="0.01" required>
                </div>

                <div class="form-group">
                    <label style="display: block; font-weight: 700; margin-bottom: 0.5rem;">Description</label>
                    <textarea th:field="*{description}" rows="5"
                        style="width: 100%; padding: 1rem; border: 1px solid #2d2f31; font-family: inherit; font-size: 1.6rem;"
                        required></textarea>
                </div>

                <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
                    <button type="submit" class="btn btn-primary" style="width: 200px;">Create Course</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
