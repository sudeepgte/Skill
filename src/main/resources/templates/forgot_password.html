<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Forgot Password | SkillHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
    <link rel="stylesheet" th:href="@{/css/navbar.css}" href="../static/css/navbar.css">
    <link rel="stylesheet" th:href="@{/css/footer.css}" href="../static/css/footer.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="../static/css/auth.css">
</head>

<body>

    <!-- Simple Navbar -->
    <nav
        style="height: 7.2rem; display: flex; align-items: center; padding: 0 2.4rem; border-bottom: 1px solid #e0e0e0;">
        <a href="/" class="logo">
            <span class="logo-text">SkillHub</span>
        </a>
    </nav>

    <div class="auth-page-container">
        <div class="container auth-split-container" style="justify-content: center;">
            <!-- Centered Form -->
            <div class="auth-form-side" style="width: 100%; max-width: 400px; padding: 0;">
                <h3 class="auth-header" style="margin-bottom: 2.4rem;">Forgot Password</h3>

                <div th:if="${message}" class="alert alert-success"
                    style="color: #0f3e0f; background-color: #dff0d8; padding: 1.6rem; margin-bottom: 1.6rem;">
                    <span th:text="${message}"></span>
                </div>

                <div th:if="${error}" class="alert alert-danger"
                    style="color: #6a1f1d; background-color: #f7dddc; padding: 1.6rem; margin-bottom: 1.6rem; border: 1px solid #f1acab;">
                    <span th:text="${error}"></span>
                </div>

                <p style="margin-bottom: 1.6rem; font-size: 1.4rem; color: #2d2f31;">
                    Enter the email provided during registration, and we will send you a link to reset your password.
                </p>

                <form th:action="@{/forgot-password}" method="post">
                    <div class="form-group">
                        <input type="email" name="email" class="form-control" placeholder="Email" required
                            style="height: 4.8rem; font-weight: 700;">
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" style="background-color: #a435f0;">Send Reset
                        Link</button>

                    <div style="text-align: center; margin-top: 1.2rem;">
                        <span style="color: #6a6f73; font-weight: 400;">Return to <a href="/login"
                                style="color: #a435f0; text-decoration: none; font-weight: 700;">Log in</a></span>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content container">
            <div class="footer-bottom">
                <div class="footer-copyright">&copy; 2024 SkillHub, Inc.</div>
            </div>
        </div>
    </footer>

</body>

</html>
