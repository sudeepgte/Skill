<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Error | SkillHub</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #d1d7dc;
        }

        .error-message {
            font-size: 1.5rem;
            color: #2d2f31;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="/" class="logo"><span class="logo-text">SkillHub</span></a>
    </nav>

    <div class="container error-container">
        <div class="error-code">500</div>
        <h2 class="error-message">Something went wrong (Status: <span th:text="${status}">500</span>)</h2>
        <p th:text="${message}" style="color: #2d2f31; font-weight: bold; margin-bottom: 1rem;"></p>
        <p th:text="${exception}" style="color: #6a6f73; font-family: monospace; font-size: 0.9rem; background: #f8f9fa; padding: 1rem; border-radius: 4px; max-width: 800px; overflow: auto; text-align: left; margin-bottom: 2rem;">Error details</p>
        <a href="/" class="btn btn-primary" style="background: #a435f0; color: #fff; padding: 10px 24px; border-radius: 4px; text-decoration: none; font-weight: bold;">Return Home</a>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 SkillHub, Inc.</p>
        </div>
    </footer>
</body>

</html>
