<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Reset Password | SkillHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-purple: #6c5ce7;
            --brand-pink: #cc2b5e;
            --brand-primary: linear-gradient(135deg, #6c5ce7, #cc2b5e);
            --form-bg: #f8faff;
            --text-dark: #1c1d1f;
            --text-muted: #6a6f73;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            background: #fff;
            width: 100%;
            max-width: 900px;
            min-height: 550px;
            display: flex;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .auth-brand-side {
            flex: 1;
            background: linear-gradient(135deg, #6c5ce7, #cc2b5e);
            position: relative;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .ornament {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }
        .o-1 { width: 300px; height: 300px; top: -100px; left: -100px; }

        .auth-brand-side h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 2rem;
            position: relative;
            z-index: 2;
        }

        .auth-brand-side p {
            font-size: 1.6rem;
            line-height: 1.6;
            opacity: 0.9;
            position: relative;
            z-index: 2;
        }

        .auth-form-side {
            flex: 1.2;
            padding: 50px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: #4a4a4a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--brand-purple);
            font-size: 1.6rem;
        }

        .form-control {
            width: 100%;
            height: 56px;
            padding: 0 20px 0 55px;
            background: #f0f3ff;
            border: 2px solid transparent;
            border-radius: 16px;
            font-size: 1.6rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: #fff;
            border-color: #d1d9ff;
            outline: none;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.1);
        }

        .btn-submit {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, #cc66ff, #6c5ce7);
            color: #fff;
            border: none;
            border-radius: 28px;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
            transition: transform 0.2s;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(108, 92, 231, 0.4); }

        .auth-footer { margin-top: 3rem; text-align: center; color: var(--text-muted); font-size: 1.5rem; }
        .auth-footer a { color: var(--brand-purple); font-weight: 700; text-decoration: none; }

        .alert {
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 12px;
            font-size: 1.4rem;
            text-align: center;
        }

        @media (max-width: 800px) {
            .auth-brand-side { display: none; }
            .auth-card { max-width: 450px; }
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="ornament o-1"></div>

        <div class="auth-brand-side">
            <h1>New Password</h1>
            <p>Your security is our priority. Enter your new credentials below to regain full access to your account.</p>
        </div>

        <div class="auth-form-side">
            <div class="form-header">
                <h2>Set Password</h2>
            </div>

            <div th:if="${error}" class="alert" style="color:#b32d2e; background:#fff2f2;" th:text="${error}">Error</div>

            <form th:action="@{/reset-password}" method="post" th:object="${passwordDto}">
                <input type="hidden" th:field="*{token}" />

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" th:field="*{newPassword}" class="form-control" placeholder="New Password" required minlength="4">
                </div>

                <div class="input-group">
                    <i class="fas fa-redo"></i>
                    <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Confirm Password" required minlength="4">
                </div>

                <button type="submit" class="btn-submit">Reset Password</button>

                <div class="auth-footer">
                    Back to <a href="/login">Login</a>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
