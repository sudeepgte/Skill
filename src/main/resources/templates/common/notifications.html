<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Notifications | SkillHub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style th:replace="~{fragments/student_sidebar :: student-sidebar-styles}"></style>
    <style>
        .container {
            max-width: 900px;
            margin: 0;
            padding: 0;
            min-height: auto;
        }

        .notification-card {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 2rem;
            margin-bottom: 1.6rem;
            display: flex;
            gap: 2rem;
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .notification-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border-color: #d1d5db;
        }

        .notification-card.unread {
            background: #fbf9ff;
            border-left: 4px solid #7c3aed;
        }

        .notification-card.unread::after {
            content: "NEW";
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #7c3aed;
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            flex-shrink: 0;
            font-size: 2rem;
        }

        /* Modern Color Coding */
        .icon-chat { background: #f3e8ff; color: #7c3aed; }
        .icon-success { background: #dcfce7; color: #16a34a; }
        .icon-info { background: #e0f2fe; color: #0284c7; }
        .icon-warning { background: #fef9c3; color: #ca8a04; }
        .icon-promo { background: #fee2e2; color: #dc2626; }
        .icon-default { background: #f3f4f6; color: #4b5563; }

        .content {
            flex-grow: 1;
        }

        .content h3 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.4rem;
        }

        .content p {
            font-size: 1.4rem;
            color: #4b5563;
            line-height: 1.6;
            margin: 0;
        }

        .time {
            color: #9ca3af;
            font-size: 1.2rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .mark-read-btn {
            background: white;
            border: 1px solid #e5e7eb;
            color: #6b7280;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mark-read-btn:hover {
            background: #f3f4f6;
            color: #7c3aed;
            border-color: #7c3aed;
        }

        h1.page-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 3rem;
            color: #111827;
            letter-spacing: -0.025em;
        }
    </style>
</head>

<body>
    <div class="student-layout">
        <aside th:replace="~{fragments/student_sidebar :: student-sidebar('notifications')}"></aside>
        <main class="student-main-content">
            <div class="container">
        <h1 class="page-title">Notifications</h1>

        <div th:if="${#lists.isEmpty(notifications)}" style="text-align: center; padding: 10rem 0; color: #6a6f73;">
            <i class="far fa-bell" style="font-size: 6rem; margin-bottom: 2rem; opacity: 0.3;"></i>
            <h2 style="font-size: 2.4rem; color: #1c1d1f; margin-bottom: 0.8rem;">You're all caught up!</h2>
            <p style="font-size: 1.6rem;">Check back later for new updates and offers.</p>
        </div>

        <div th:each="note : ${notifications}" class="notification-card" th:classappend="${!note.read} ? 'unread'">
            <div class="icon-box" th:classappend="${
                note.type == 'CHAT' ? 'icon-chat' : 
                (note.type == 'SUCCESS' ? 'icon-success' : 
                (note.type == 'WARNING' ? 'icon-warning' : 
                (note.type == 'PROMO' ? 'icon-promo' : 'icon-info')))
            }">
                <i class="far fa-comments" th:if="${note.type == 'CHAT'}"></i>
                <i class="fas fa-check" th:if="${note.type == 'SUCCESS'}"></i>
                <i class="fas fa-exclamation-triangle" th:if="${note.type == 'WARNING'}"></i>
                <i class="fas fa-gift" th:if="${note.type == 'PROMO'}"></i>
                <i class="fas fa-info-circle" th:if="${note.type == 'INFO'}"></i>
                <i class="fas fa-bell" th:unless="${note.type}"></i>
            </div>
            <div class="content">
                <h3 th:text="${note.title}">Title</h3>
                <p th:text="${note.message}">Message content goes here...</p>
                <div class="time"><i class="far fa-clock"></i> <span
                        th:text="${#temporals.format(note.createdAt, 'MMM dd, HH:mm')}">Time</span></div>
            </div>
            <div th:if="${!note.read}">
                <form th:action="@{/notifications/mark-read}" method="post">
                    <input type="hidden" name="id" th:value="${note.id}">
                    <button type="submit" class="mark-read-btn" title="Mark as Read">
                        <i class="fas fa-check-circle"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
        </main>
    </div>

    <!-- SkillHub Global Broadcast Popup Notification -->
    <script th:src="@{/js/broadcast-popup.js}" src="/js/broadcast-popup.js" defer></script>
</body>

</html>
