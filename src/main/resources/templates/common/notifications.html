<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Notifications | SkillHub</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .notification-card {
            background: white;
            border: 1px solid #d1d7dc;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .notification-card.unread {
            border-left: 4px solid #a435f0;
            background: #fcfcfc;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2d2f31;
            color: white;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .content {
            flex-grow: 1;
        }

        .time {
            color: #6a6f73;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .mark-read-btn {
            background: none;
            border: none;
            color: #a435f0;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>

<body style="background-color: #f7f9fa;">
    <nav class="navbar">
        <a href="/" class="logo"><span class="logo-text">SkillHub</span></a>
        <div class="nav-actions">
            <a href="/user/home" class="btn btn-ghost">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <h1>Notifications</h1>

        <div th:if="${#lists.isEmpty(notifications)}" style="text-align: center; padding: 3rem; color: #6a6f73;">
            <i class="far fa-bell" style="font-size: 3rem; margin-bottom: 1rem;"></i>
            <p>You have no notifications yet.</p>
        </div>

        <div th:each="note : ${notifications}" class="notification-card" th:classappend="${!note.read} ? 'unread'">
            <div class="icon-box">
                <i class="fas fa-info" th:if="${note.type == 'INFO'}"></i>
                <i class="fas fa-check" th:if="${note.type == 'SUCCESS'}"></i>
                <i class="fas fa-exclamation" th:if="${note.type == 'WARNING'}"></i>
                <i class="fas fa-bolt" th:if="${note.type == 'PROMO'}"></i>
                <i class="fas fa-bell" th:unless="${note.type}"></i>
            </div>
            <div class="content">
                <h3 th:text="${note.title}" style="margin: 0 0 5px 0; font-size: 1rem;">Title</h3>
                <p th:text="${note.message}" style="margin: 0; color: #2d2f31;">Message content goes here...</p>
                <div class="time" th:text="${#temporals.format(note.createdAt, 'MMM dd, HH:mm')}">Time</div>
            </div>
            <div th:if="${!note.read}">
                <form th:action="@{/notifications/mark-read}" method="post">
                    <input type="hidden" name="id" th:value="${note.id}">
                    <button type="submit" class="mark-read-btn" title="Mark as Read"><i
                            class="fas fa-check"></i></button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
