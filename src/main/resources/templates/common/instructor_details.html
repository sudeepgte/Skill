<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${instructor.name} + ' | SkillHub Expert'">Instructor Details | SkillHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <style th:replace="~{fragments/footer :: footer-styles}"></style>
    
    <!-- SockJS and Stomp for navbar notifications to function correctly -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        :root {
            --bg: #F5F3FF;
            --surface: #EDE9FE;
            --surface2: #DDD6FE;
            --primary: #A78BFA;
            --secondary: #8B5CF6;
            --accent: #C4B5FD;
            --highlight: #F472B6;
            --text: #2E1065;
            --text-muted: #8B5CF6;
            --text-dim: #7C3AED;
            --border: rgba(167, 139, 250, 0.18);
            --border-hover: rgba(167, 139, 250, 0.4);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-size: 16px;
            line-height: 1.7;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 3px; }

        .details-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px 100px 20px;
        }

        .instructor-header-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 50px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .instructor-header-layout {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 30px 20px;
            }
            .left-col {
                margin: 0 auto;
            }
        }

        .left-col {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .instructor-large-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.15);
            margin-bottom: 20px;
        }

        .large-social-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .large-social-link {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.1);
            color: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .large-social-link:hover {
            background: var(--secondary);
            color: white !important;
            transform: scale(1.1);
        }

        .right-col {
            display: flex;
            flex-direction: column;
        }

        .instructor-spec-badge {
            align-self: flex-start;
            background: rgba(139, 92, 246, 0.1);
            color: var(--secondary);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 50px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .instructor-spec-badge {
                align-self: center;
            }
        }

        .instructor-name {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 900;
            color: var(--text);
            margin: 0 0 10px 0;
        }

        .instructor-meta-stats {
            font-size: 15px;
            color: var(--text-dim);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .bio-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--text);
        }

        .bio-text {
            font-size: 16px;
            color: var(--text-dim);
            line-height: 1.8;
            margin: 0;
            white-space: pre-line;
        }

        .courses-section-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 30px;
            border-left: 4px solid var(--secondary);
            padding-left: 15px;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .course-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .course-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(139, 92, 246, 0.15);
        }

        .course-thumb {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .course-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .course-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .course-cat-tag {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--secondary);
            background: rgba(139, 92, 246, 0.1);
            padding: 4px 10px;
            border-radius: 50px;
        }

        .course-rating {
            font-size: 13px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .course-title {
            font-weight: 600;
            font-size: 18px;
            color: var(--text);
            line-height: 1.4;
            margin: 0 0 10px 0;
            flex-grow: 1;
        }

        .progress-bar {
            height: 6px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: var(--secondary);
            border-radius: 10px;
        }

        .course-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .course-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .enroll-btn {
            background: var(--secondary);
            color: white !important;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .enroll-btn:hover {
            background: var(--text);
        }

        .no-courses {
            padding: 40px;
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
            text-align: center;
            color: var(--text-dim);
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Container -->
    <div class="details-page">
        
        <!-- Instructor Header Card -->
        <header class="instructor-header-layout">
            <div class="left-col">
                <img th:src="${instructor.profileImageUrl != null && !instructor.profileImageUrl.isEmpty()} ? ${instructor.profileImageUrl} : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&q=80'" class="instructor-large-photo" th:alt="${instructor.name}">
                
                <!-- Social Connections -->
                <div class="large-social-links" th:if="${(instructor.linkedinUrl != null && !instructor.linkedinUrl.isEmpty()) || (instructor.youtubeUrl != null && !instructor.youtubeUrl.isEmpty()) || (instructor.instagramUrl != null && !instructor.instagramUrl.isEmpty())}">
                    <a th:href="${instructor.linkedinUrl}" th:if="${instructor.linkedinUrl != null && !instructor.linkedinUrl.isEmpty()}" class="large-social-link" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a th:href="${instructor.youtubeUrl}" th:if="${instructor.youtubeUrl != null && !instructor.youtubeUrl.isEmpty()}" class="large-social-link" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
                    <a th:href="${instructor.instagramUrl}" th:if="${instructor.instagramUrl != null && !instructor.instagramUrl.isEmpty()}" class="large-social-link" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
            
            <div class="right-col">
                <span class="instructor-spec-badge" th:text="${instructor.headline != null && !instructor.headline.isEmpty()} ? ${instructor.headline} : 'Expert Instructor'">Headline</span>
                <h1 class="instructor-name" th:text="${instructor.name}">Instructor Name</h1>
                <div class="instructor-meta-stats" th:text="${instructor.skills != null && !instructor.skills.isEmpty()} ? ${instructor.skills} : 'Verified Creator'">Experience</div>
                
                <h3 class="bio-title">Biography</h3>
                <p class="bio-text" th:text="${instructor.bio != null && !instructor.bio.isEmpty()} ? ${instructor.bio} : 'This instructor is an experienced professional in their domain, dedicated to teaching and building real-world skills.'">Bio</p>
            </div>
        </header>

        <!-- Courses Taught Section -->
        <section>
            <h2 class="courses-section-title" th:text="'Courses Taught by ' + ${instructor.name}">Courses Taught</h2>
            
            <div class="courses-grid" th:if="${courses != null && !courses.empty}">
                <a th:href="@{/course/{id}(id=${course.id})}" class="course-card" th:each="course : ${courses}">
                    <img th:src="${course.imageUrl != null && !course.imageUrl.isEmpty()} ? ${course.imageUrl} : 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&q=80'" class="course-thumb" th:alt="${course.title}">
                    <div class="course-body">
                        <div class="course-meta">
                            <span class="course-cat-tag" th:text="${course.category != null ? course.category.name : 'General'}">Category</span>
                            <span class="course-rating">★ <span th:text="${course.averageRating}">4.9</span></span>
                        </div>
                        <h3 class="course-title" th:text="${course.title}">Course Title</h3>
                        
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 100%"></div>
                        </div>
                        
                        <div class="course-footer">
                            <span class="course-price" th:text="'₹' + ${course.price}">₹1,499</span>
                            <span class="enroll-btn">Explore Course</span>
                        </div>
                    </div>
                </a>
            </div>
            
            <div class="no-courses" th:if="${courses == null || courses.empty}">
                <p>This instructor hasn't published any courses yet. Check back soon!</p>
            </div>
        </section>

    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
