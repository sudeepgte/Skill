<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful | SkillHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #5624d0;
            --success: #059669;
            --text-dark: #1c1d1f;
            --text-muted: #6a6f73;
            --bg-light: #f7f9fa;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .success-card {
            background: white;
            padding: 4rem 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #ecfdf5;
            color: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 2rem;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 2rem; }

        .txn-details {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 2.5rem;
        }

        .txn-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .txn-label { color: var(--text-muted); }
        .txn-value { font-weight: 600; }

        .btn-start {
            display: block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 1.2rem;
            border-radius: 4px;
            font-weight: 700;
            margin-bottom: 1rem;
            transition: opacity 0.2s;
        }

        .btn-receipt {
            display: block;
            background: white;
            color: var(--text-dark);
            text-decoration: none;
            padding: 1.1rem;
            border-radius: 4px;
            font-weight: 700;
            border: 1px solid var(--text-dark);
            transition: background 0.2s;
        }

        .btn-receipt:hover { background: #f8fafc; }
        .btn-start:hover { opacity: 0.9; }

        .confetti {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Payment Successful!</h1>
        <p class="subtitle">Thank you for your purchase. Your learning journey begins now.</p>

        <div class="txn-details">
            <div class="txn-row">
                <span class="txn-label">Transaction ID</span>
                <span class="txn-value" th:text="${payment.transactionId}">TXN-123456</span>
            </div>
            <div class="txn-row">
                <span class="txn-label">Course</span>
                <span class="txn-value" th:text="${payment.course.title}">Advanced Digital Marketing</span>
            </div>
            <div class="txn-row">
                <span class="txn-label">Amount Paid</span>
                <span class="txn-value" th:text="'₹' + ${payment.amount}">₹2000</span>
            </div>
            <div class="txn-row">
                <span class="txn-label">Date</span>
                <span class="txn-value" th:text="${#temporals.format(payment.paymentDate, 'dd MMM yyyy, HH:mm')}">12 Apr 2024</span>
            </div>
        </div>

        <a th:href="@{/course/{id}/learn(id=${payment.course.id})}" class="btn-start">Start Learning Now</a>
        <a th:href="@{/payment/receipt/{txnId}(txnId=${payment.transactionId})}" target="_blank" class="btn-receipt">
            <i class="fas fa-download"></i> Download Receipt
        </a>
    </div>

    <!-- Simple JS to show/hide based on enrollment status if needed, but here it's static -->
    <!-- SkillHub Global Broadcast Popup Notification -->
    <script th:src="@{/js/broadcast-popup.js}" src="/js/broadcast-popup.js" defer></script>
</body>
</html>
