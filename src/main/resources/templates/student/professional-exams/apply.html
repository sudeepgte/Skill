<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Apply for ' + ${exam.title} + ' | SkillHub'">Apply for Exam | SkillHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <style th:replace="~{fragments/footer :: footer-styles}"></style>
    <style>
        :root {
            --primary: #5624d0;
            --primary-hover: #401b9c;
            --dark: #1c1d1f;
            --muted: #6a6f73;
            --bg-light: #f7f9fa;
            --border: #d1d7dc;
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }
        .navbar {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: var(--dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .main-container {
            max-width: 650px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
        }
        .breadcrumb {
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .form-card {
            background: white;
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 2.5rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }
        .form-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .form-icon {
            width: 56px;
            height: 56px;
            background: #ede9fe;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1rem;
        }
        .form-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 0.5rem;
            color: var(--dark);
        }
        .form-header p {
            color: var(--muted);
            font-size: 0.95rem;
            margin: 0;
        }
        .form-group {
            margin-bottom: 1.4rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.92rem;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }
        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(86, 36, 208, 0.12);
        }
        .btn-submit {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.95rem;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 1.8rem;
        }
        .btn-submit:hover {
            background: var(--primary-hover);
        }
        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 600;
        }
        .btn-cancel:hover { color: var(--dark); }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-container">
        <div class="breadcrumb">
            <a href="/student/professional-exams">Professional Exams</a> &nbsp;/&nbsp; 
            <a th:href="@{/student/professional-exams/{id}(id=${exam.id})}" th:text="${exam.title}">Exam</a> &nbsp;/&nbsp;
            <span>Apply</span>
        </div>

        <div class="form-card">
            <div class="form-header">
                <div class="form-icon">
                    <i class="fas fa-file-signature"></i>
                </div>
                <h1>Candidate Application</h1>
                <p>Register for <strong th:text="${exam.title}">Certification</strong></p>
            </div>

            <form th:action="@{/student/professional-exams/{id}/apply(id=${exam.id})}" method="post" th:object="${application}">
                <input type="hidden" name="id" value="" />
                <div class="form-group">
                    <label for="fullName">Full Legal Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Enter your full legal name" required />
                </div>

                <div class="form-group">
                    <label for="currentRole">Current Role / Background</label>
                    <input type="text" id="currentRole" th:field="*{currentRole}" class="form-control" placeholder="e.g. Student, Software Developer" required />
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> Submit Application
                </button>
                <a th:href="@{/student/professional-exams/{id}(id=${exam.id})}" class="btn-cancel">Cancel</a>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <!-- SkillHub Global Broadcast Popup Notification -->
    <script th:src="@{/js/broadcast-popup.js}" src="/js/broadcast-popup.js" defer></script>
</body>
</html>
