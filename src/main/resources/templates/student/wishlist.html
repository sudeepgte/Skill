<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Wishlist | SkillHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <style th:replace="~{fragments/footer :: footer-styles}"></style>
    <style>
        :root {
            --primary: #a435f0;
            --primary-dark: #8710d8;
            --bg-gray: #f7f9fa;
            --text-main: #1c1d1f;
            --text-muted: #6a6f73;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Playfair Display', sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* ── Header Design ── */
        .dashboard-header {
            background-image: linear-gradient(rgba(28, 29, 31, 0.8), rgba(28, 29, 31, 0.8)), url('/images/student_dashboard_hero.png');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 8rem 0 6rem;
            margin-bottom: 0;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .header-content {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 4rem 2.4rem;
            text-align: center;
        }

        .header-content h1 {
            font-size: 5.6rem;
            font-weight: 800;
            margin-bottom: 0;
            color: #fff;
            letter-spacing: -2px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            font-family: 'Playfair Display', sans-serif;
        }

        .header-tabs {
            display: flex;
            gap: 3.2rem;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-tab {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            font-size: 1.6rem;
            padding: 1.2rem 0;
            position: relative;
            transition: var(--transition);
        }

        .header-tab:hover {
            color: white;
        }

        .header-tab.active {
            color: white;
        }

        .header-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            box-shadow: 0 -2px 10px rgba(164, 53, 240, 0.5);
        }

        /* ── Main Container ── */
        .main-container {
            max-width: 1200px;
            margin: 6.4rem auto;
            padding: 0 2.4rem 8rem;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* ── Wishlist Grid ── */
        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 3.2rem;
        }

        .wish-card {
            background: white;
            border-radius: 1.6rem;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .wish-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        .card-img-wrap {
            position: relative;
            height: 160px;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .wish-card:hover .card-img {
            transform: scale(1.1);
        }

        .remove-overlay {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            z-index: 10;
        }

        .btn-remove {
            width: 3.6rem;
            height: 3.6rem;
            background: white;
            border: none;
            border-radius: 50%;
            color: #ff4757;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: var(--transition);
        }

        .btn-remove:hover {
            background: #ff4757;
            color: white;
            transform: rotate(90deg);
        }

        .card-body {
            padding: 2.4rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            line-height: 1.4;
            color: var(--text-main);
            height: 5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .instructor {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 1.6rem;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 1.6rem;
            border-top: 1px solid #f1f3f4;
        }

        .price {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .btn-view {
            background: var(--primary);
            color: white;
            padding: 0.8rem 1.6rem;
            border-radius: 0.6rem;
            font-weight: 700;
            font-size: 1.3rem;
            transition: var(--transition);
        }

        .btn-view:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(164, 53, 240, 0.3);
        }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 10rem 0;
            background: white;
            border-radius: 2rem;
            box-shadow: var(--card-shadow);
        }

        .empty-icon {
            font-size: 8rem;
            background: linear-gradient(135deg, #eee 0%, #ddd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2.4rem;
        }

        .empty-state h2 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 1.2rem;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 1.6rem;
            margin-bottom: 3.2rem;
        }

        .btn-browse {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            background: var(--text-main);
            color: white;
            padding: 1.6rem 3.2rem;
            border-radius: 1rem;
            font-weight: 700;
            transition: var(--transition);
        }

        .btn-browse:hover {
            background: #000;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <header class="dashboard-header" 
            style="background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('/images/wishlist_hero.png'); min-height: 400px;">
        <div class="header-content">
            <h1>My Learning</h1>
        </div>
    </header>

    <main class="main-container">

        <div th:if="${#lists.isEmpty(wishlistItems)}" class="empty-state">
            <div class="empty-icon"><i class="fas fa-heart-broken"></i></div>
            <h2>Your wishlist is empty</h2>
            <p>Ready to find your next favorite course? Explore our latest offerings.</p>
            <a th:href="@{/#courses}" href="/#courses" class="btn-browse">
                <i class="fas fa-search"></i> Browse Courses
            </a>
        </div>

        <div th:unless="${#lists.isEmpty(wishlistItems)}">
            <div class="section-title">
                <span>Courses you're interested in</span>
                <span class="badgE" style="font-size:1.4rem; color:var(--primary); font-weight:700;"
                    th:text="${#lists.size(wishlistItems)} + ' Items'">0 Items</span>
            </div>

            <div class="wishlist-grid">
                <div th:each="item : ${wishlistItems}" class="wish-card">
                    <div class="remove-overlay">
                        <form th:action="@{/course/wishlist/remove}" method="post">
                            <input type="hidden" name="courseId" th:value="${item.course.id}" />
                            <button type="submit" class="btn-remove" title="Remove from Wishlist">
                                <i class="fas fa-times"></i>
                            </button>
                        </form>
                    </div>
                    <div class="card-img-wrap">
                        <img th:src="${item.course.imageUrl}" class="card-img" alt="Course Thumbnail">
                    </div>
                    <div class="card-body">
                        <h3 class="card-title" th:text="${item.course.title}">Course Title</h3>
                        <div class="instructor" th:text="'By ' + ${item.course.instructor.name}">Instructor Name</div>

                        <div class="price-row">
                            <div class="price" th:text="${item.course.price == null or item.course.price == 0} ? 'Free' : '₹' + ${item.course.price}">₹0</div>
                            <a th:href="@{/course/{id}(id=${item.course.id})}" class="btn-view">View Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
