<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Upload Video | Admin</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border: 1px solid #d1d7dc;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: #2E1065;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #1c1d1f;
            border-radius: 4px;
        }

        .btn-primary {
            background-color: #2E1065;
            color: white;
            padding: 12px 24px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #A78BFA;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body style="background-color: #F5F3FF;">
    <nav class="navbar">
        <a href="/admin/dashboard" class="logo"><span class="logo-text">SkillHub Admin</span></a>
    </nav>

    <div class="container">
        <a th:href="@{/admin/dashboard}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>

        <div class="card">
            <h1>Upload Video Resource</h1>
            <p style="color: #6a6f73; margin-bottom: 2rem;">Upload videos to the library and assign them a category for
                easy discovery.</p>

            <div th:if="${success}" class="alert alert-success"
                style="background: #e6f2f5; color: #1c1d1f; padding: 1rem; margin-bottom: 1rem;">
                <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            </div>

            <form th:action="@{/admin/upload}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Video Title</label>
                    <input type="text" name="title" placeholder="e.g. Intro to Python" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select name="categoryId" required>
                        <option value="" disabled selected>Select a Category...</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Upload Type</label>
                    <div style="display: flex; gap: 20px;">
                        <label style="font-weight: normal;">
                            <input type="radio" name="uploadType" value="file" checked onchange="toggleUploadType()"
                                style="width: auto;">
                            Upload File
                        </label>
                        <label style="font-weight: normal;">
                            <input type="radio" name="uploadType" value="youtube" onchange="toggleUploadType()"
                                style="width: auto;">
                            YouTube URL
                        </label>
                    </div>
                </div>

                <div class="form-group" id="fileGroup">
                    <label>Select Video File</label>
                    <input type="file" name="file" accept="video/*" style="border: 1px solid #d1d7dc; padding: 10px;">
                </div>

                <div class="form-group" id="youtubeGroup" style="display: none;">
                    <label>YouTube Video URL</label>
                    <input type="text" name="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..."
                        style="border: 1px solid #d1d7dc; padding: 10px;">
                </div>

                <script>
                    function toggleUploadType() {
                        const type = document.querySelector('input[name="uploadType"]:checked').value;
                        const fileGroup = document.getElementById('fileGroup');
                        const youtubeGroup = document.getElementById('youtubeGroup');
                        const fileInput = document.querySelector('input[name="file"]');
                        const youtubeInput = document.querySelector('input[name="youtubeUrl"]');

                        if (type === 'file') {
                            fileGroup.style.display = 'block';
                            youtubeGroup.style.display = 'none';
                            fileInput.required = true;
                            youtubeInput.required = false;
                            youtubeInput.value = '';
                        } else {
                            fileGroup.style.display = 'none';
                            youtubeGroup.style.display = 'block';
                            fileInput.required = false;
                            youtubeInput.required = true;
                            fileInput.value = '';
                        }
                    }

                    // File size validation
                    document.querySelector('input[name="file"]').addEventListener('change', function () {
                        const file = this.files[0];
                        const maxSize = 2 * 1024 * 1024 * 1024; // 2GB
                        if (file && file.size > maxSize) {
                            alert('File is too large! Maximum size is 2GB.');
                            this.value = ''; // Clear the input
                        }
                    });
                </script>

                <button type="submit" class="btn btn-primary">Upload to Library</button>
            </form>
        </div>
    </div>
</body>

</html>
