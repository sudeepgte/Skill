<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Manage Courses | SkillHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body style="background-color: #f7f9fa;">
    <nav class="navbar">
        <a href="/admin/dashboard" class="logo"><span class="logo-text">SkillHub Admin</span></a>
    </nav>
    <div class="container" style="padding-top: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Manage Courses</h1>
            <a href="/admin/courses/create" class="btn btn-primary"
                style="background-color: #a435f0; color: white; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 4px;">Create
                New Course</a>
        </div>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px; background: white;">
            <thead>
                <tr style="background: #2d2f31; color: white;">
                    <th style="padding: 10px; text-align: left;">ID</th>
                    <th style="padding: 10px; text-align: left;">Title</th>
                    <th style="padding: 10px; text-align: left;">Instructor</th>
                    <th style="padding: 10px; text-align: left;">Status</th>
                    <th style="padding: 10px; text-align: left;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${courses.empty}">
                    <td colspan="5" style="padding: 20px; text-align: center; color: #6a6f73;">
                        No courses found. <a href="/admin/courses/create" style="color: #a435f0;">Create one now</a>.
                    </td>
                </tr>
                <tr th:each="course : ${courses}" style="border-bottom: 1px solid #d1d7dc;">
                    <td style="padding: 10px;" th:text="${course.id}">1</td>
                    <td style="padding: 10px;" th:text="${course.title}">Java Masterclass</td>
                    <td style="padding: 10px;"
                        th:text="${course.instructor != null ? course.instructor.name : 'Unknown'}">Jane Doe</td>
                    <td style="padding: 10px;">
                        <span th:if="${course.published}" style="color: green; font-weight: bold;">Published</span>
                        <span th:unless="${course.published}" style="color: grey;">Draft</span>
                    </td>
                    <td style="padding: 10px;">
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <a th:href="@{/course/{id}(id=${course.id})}" target="_blank" class="btn btn-ghost text-sm"
                                style="color: #007bff; text-decoration: none; font-weight: bold;">View</a>
                            <a th:href="@{/admin/courses/edit(id=${course.id})}" class="btn btn-ghost text-sm"
                                style="color: #a435f0; text-decoration: none; font-weight: bold;">Edit</a>
                            <a th:href="@{/admin/courses/{id}/questions(id=${course.id})}" class="btn btn-ghost text-sm"
                                style="color: #ff9800; text-decoration: none; font-weight: bold;">Exams</a>
                            <form th:if="${!course.published}" th:action="@{/admin/courses/publish}" method="post"
                                style="display:inline;">
                                <input type="hidden" name="id" th:value="${course.id}">
                                <button class="btn btn-ghost text-sm" style="color: green;">Publish</button>
                            </form>

                            <form th:if="${course.published}" th:action="@{/admin/courses/unpublish}" method="post"
                                style="display:inline;">
                                <input type="hidden" name="id" th:value="${course.id}">
                                <button class="btn btn-ghost text-sm" style="color: orange;">Unpublish</button>
                            </form>

                            <form th:action="@{/admin/courses/delete}" method="post" style="display:inline;">
                                <input type="hidden" name="id" th:value="${course.id}">
                                <button class="btn btn-ghost text-sm" style="color: red;">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
