<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Manage Courses | SkillHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body style="background-color: #f7f9fa;">
    <nav class="navbar">
        <a href="/admin/dashboard" class="logo"><span class="logo-text">SkillHub Admin</span></a>
    </nav>
    <div class="container" style="padding-top: 2rem;">
        <h1>Manage Courses</h1>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px; background: white;">
            <thead>
                <tr style="background: #2d2f31; color: white;">
                    <th style="padding: 10px; text-align: left;">ID</th>
                    <th style="padding: 10px; text-align: left;">Title</th>
                    <th style="padding: 10px; text-align: left;">Instructor</th>
                    <th style="padding: 10px; text-align: left;">Status</th>
                    <th style="padding: 10px; text-align: left;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}" style="border-bottom: 1px solid #d1d7dc;">
                    <td style="padding: 10px;" th:text="${course.id}">1</td>
                    <td style="padding: 10px;" th:text="${course.title}">Java Masterclass</td>
                    <td style="padding: 10px;" th:text="${course.instructor.name}">Jane Doe</td>
                    <td style="padding: 10px;" th:text="${course.published ? 'Published' : 'Draft'}">Published</td>
                    <td style="padding: 10px;">
                        <form th:action="@{/admin/courses/delete}" method="post" style="display:inline;">
                            <input type="hidden" name="id" th:value="${course.id}">
                            <button class="btn btn-ghost text-sm" style="color: red;">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
