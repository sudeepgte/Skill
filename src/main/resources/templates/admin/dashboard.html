<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Dashboard | SkillHub</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body style="background-color: #f7f9fa;">

    <nav class="navbar">
        <a href="/" class="logo"><span class="logo-text">SkillHub Admin</span></a>
        <div class="nav-actions">
            <a href="/home" class="btn btn-ghost">Main Site</a>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button class="btn btn-ghost">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container" style="min-height: 80vh; padding-top: 2rem;">
        <h1>Admin Dashboard</h1>

        <div style="display: flex; gap: 20px; margin-top: 2rem;">
            <!-- Improve stats cards styling -->
            <div style="flex: 1; background: white; padding: 2rem; border: 1px solid #d1d7dc;">
                <h3 style="margin: 0; color: #6a6f73;">Total Users</h3>
                <p style="font-size: 3rem; font-weight: 700; margin: 10px 0 0;" th:text="${totalUsers}">0</p>
                <a href="/admin/users" class="btn btn-ghost text-sm"
                    style="margin-top: 1rem; display: inline-block;">Manage Users</a>
            </div>

            <div style="flex: 1; background: white; padding: 2rem; border: 1px solid #d1d7dc;">
                <h3 style="margin: 0; color: #6a6f73;">Total Courses</h3>
                <p style="font-size: 3rem; font-weight: 700; margin: 10px 0 0;" th:text="${totalCourses}">0</p>
                <a href="/admin/courses" class="btn btn-ghost text-sm"
                    style="margin-top: 1rem; display: inline-block;">Manage Courses</a>
            </div>
        </div>

    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 SkillHub, Inc.</p>
        </div>
    </footer>
</body>

</html>
