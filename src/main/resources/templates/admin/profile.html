<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Profile | SkillHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

    <!-- ══ SIDEBAR ══ -->
    <aside class="admin-sidebar" id="adminSidebar">

        <div class="sidebar-brand">
            <div class="sidebar-brand-icon"><i class="fas fa-graduation-cap"></i></div>
            <div>
                <div class="sidebar-brand-name">SkillHub</div>
                <div class="sidebar-brand-sub">Admin Console</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section-label">Main</div>

            <a href="/admin/dashboard" class="nav-item">
                <i class="fas fa-th-large"></i> Dashboard
            </a>

            <a href="/admin/users" class="nav-item">
                <i class="fas fa-users"></i> Users
            </a>

            <a href="/admin/courses" class="nav-item">
                <i class="fas fa-graduation-cap"></i> Courses
            </a>

            <a href="/admin/categories" class="nav-item">
                <i class="fas fa-tags"></i> Categories
            </a>

            <a href="/admin/exams" class="nav-item">
                <i class="fas fa-file-alt"></i> Exams
            </a>

            <div class="nav-section-label" style="margin-top: 0.8rem;">Communications</div>

            <a href="/admin/broadcast" class="nav-item">
                <i class="fas fa-envelope"></i> Broadcast Email
            </a>
        </nav>

        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </form>
        </div>

    </aside>

    <!-- ══ MAIN BODY ══ -->
    <div class="admin-body">

        <!-- Top Bar -->
        <header class="admin-topbar">
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>

            <div class="topbar-title">Admin Profile</div>

            <form class="topbar-search" action="/home" method="get">
                <i class="fas fa-search"></i>
                <input type="text" name="query" placeholder="Search...">
            </form>

            <div class="topbar-actions">
                <a href="/admin/profile" class="admin-avatar active" title="My Profile">
                    <span th:text="${#strings.substring(admin.name,0,1)}" th:if="${admin != null}">A</span>
                    <span th:unless="${admin != null}">A</span>
                </a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="admin-main">

            <div class="page-header">
                <div class="page-header-left">
                    <h1>Profile Settings</h1>
                    <p>Manage your administrator account details and security.</p>
                </div>
            </div>

            <div class="content-grid" style="grid-template-columns: 1fr 2fr;">

                <!-- Profile Info Panel -->
                <div class="panel">
                    <div class="panel-header" style="justify-content: center; border-bottom: none; padding-bottom: 0;">
                        <div style="width: 80px; height: 80px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 700; margin-top: 1.6rem; box-shadow: 0 4px 12px rgba(44,62,80,0.2);">
                            <span th:text="${#strings.substring(admin.name,0,1)}" th:if="${admin != null}">A</span>
                            <span th:unless="${admin != null}">A</span>
                        </div>
                    </div>
                    <div class="panel-body" style="text-align: center; padding-top: 1.6rem;">
                        <h2 style="font-size: 2rem; color: var(--text); font-weight: 700; margin-bottom: 0.4rem;" th:text="${admin != null ? admin.name : 'Administrator'}">Administrator Name</h2>
                        <p style="color: var(--text-muted); font-size: 1.4rem; margin-bottom: 2.4rem;" th:text="${admin != null ? admin.email : 'admin@skillhub.com'}">admin@email.com</p>
                        
                        <div style="background: rgba(44,62,80,0.05); border-radius: 0.8rem; padding: 1.6rem; text-align: left; margin-bottom: 2.4rem;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 1.2rem; font-size: 1.4rem;">
                                <span style="font-weight: 600; color: var(--text);">Role:</span>
                                <span class="pill pill-blue">System Admin</span>
                            </div>
                        </div>

                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn-primary-admin" style="width: 100%; justify-content: center; background: rgba(231,76,60,0.1); color: var(--danger); font-size: 1.4rem; padding: 1.2rem;">
                                <i class="fas fa-sign-out-alt"></i> Terminate Session
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Security Panel -->
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title"><i class="fas fa-lock" style="color:var(--accent); margin-right:0.8rem;"></i> Change Password</span>
                    </div>
                    <div class="panel-body">

                        <!-- Alerts -->
                        <div th:if="${success}" style="margin-bottom: 2.4rem; padding: 1.6rem; background: rgba(39,174,96,0.1); border-left: 4px solid var(--success); color: var(--success); border-radius: 0 0.8rem 0.8rem 0; font-weight: 500; display: flex; align-items: center; gap: 1.2rem; font-size: 1.4rem;">
                            <i class="fas fa-check-circle" style="font-size: 1.8rem;"></i> <span th:text="${success}"></span>
                        </div>
                        <div th:if="${error}" style="margin-bottom: 2.4rem; padding: 1.6rem; background: rgba(231,76,60,0.1); border-left: 4px solid var(--danger); color: var(--danger); border-radius: 0 0.8rem 0.8rem 0; font-weight: 500; display: flex; align-items: center; gap: 1.2rem; font-size: 1.4rem;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 1.8rem;"></i> <span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/admin/change-password}" method="post">
                            <div class="form-group" style="margin-bottom: 1.6rem;">
                                <label class="form-label">Current Password</label>
                                <input type="password" name="oldPassword" class="form-control" required>
                            </div>

                            <div class="form-group" style="margin-bottom: 1.6rem;">
                                <label class="form-label">New Password</label>
                                <input type="password" name="newPassword" class="form-control" minlength="6" required>
                            </div>

                            <div class="form-group" style="margin-bottom: 2.4rem;">
                                <label class="form-label">Confirm New Password</label>
                                <input type="password" name="confirmPassword" class="form-control" minlength="6" required>
                            </div>
                            
                            <div style="display: flex; justify-content: flex-end;">
                                <button type="submit" class="btn-primary-admin" style="padding: 1.2rem 2.4rem;">
                                    <i class="fas fa-key"></i> Update Security
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <script>
        // Mobile sidebar toggle
        const sidebar  = document.getElementById('adminSidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
        }
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 900 && !sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });
    </script>
</body>

</html>
