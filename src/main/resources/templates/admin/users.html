<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Manage Users | SkillHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body style="background-color: #f7f9fa;">
    <nav class="navbar">
        <a href="/admin/dashboard" class="logo"><span class="logo-text">SkillHub Admin</span></a>
    </nav>
    <div class="container" style="padding-top: 2rem;">
        <h1>Manage Users</h1>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px; background: white;">
            <thead>
                <tr style="background: #2d2f31; color: white;">
                    <th style="padding: 10px; text-align: left;">ID</th>
                    <th style="padding: 10px; text-align: left;">Name</th>
                    <th style="padding: 10px; text-align: left;">Email</th>
                    <th style="padding: 10px; text-align: left;">Role</th>
                    <th style="padding: 10px; text-align: left;">Status</th>
                    <th style="padding: 10px; text-align: left;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}" style="border-bottom: 1px solid #d1d7dc;">
                    <td style="padding: 10px;" th:text="${user.id}">1</td>
                    <td style="padding: 10px;" th:text="${user.name}">John Doe</td>
                    <td style="padding: 10px;" th:text="${user.email}">john@example.com</td>
                    <td style="padding: 10px;" th:text="${user.role}">STUDENT</td>
                    <td style="padding: 10px;">
                        <span th:if="${user.blocked}" style="color: red; font-weight: bold;">BLOCKED</span>
                        <span th:unless="${user.blocked}" style="color: green;">Active</span>
                        <br>
                        <small style="color: #6a6f73;" th:if="${user.lastLoginDate != null}"
                            th:text="${#temporals.format(user.lastLoginDate, 'yyyy-MM-dd HH:mm')}"></small>
                    </td>
                    <td style="padding: 10px;">
                        <div style="display: flex; gap: 10px;">
                            <form th:if="${!user.blocked}" th:action="@{/admin/users/block}" method="post"
                                style="display:inline;">
                                <input type="hidden" name="id" th:value="${user.id}">
                                <button class="btn btn-ghost text-sm" style="color: orange;">Block</button>
                            </form>

                            <form th:if="${user.blocked}" th:action="@{/admin/users/unblock}" method="post"
                                style="display:inline;">
                                <input type="hidden" name="id" th:value="${user.id}">
                                <button class="btn btn-ghost text-sm" style="color: green;">Unblock</button>
                            </form>

                            <form th:action="@{/admin/users/delete}" method="post" style="display:inline;">
                                <input type="hidden" name="id" th:value="${user.id}">
                                <button class="btn btn-ghost text-sm" style="color: red;">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
