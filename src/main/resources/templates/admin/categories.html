<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Manage Categories | SkillHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border: 1px solid #d1d7dc;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: #2d2f31;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #1c1d1f;
            border-radius: 4px;
        }

        .btn-primary {
            background-color: #2d2f31;
            color: white;
            padding: 12px 24px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .category-list {
            list-style: none;
            padding: 0;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #a435f0;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body style="background-color: #f7f9fa;">
    <nav class="navbar">
        <a href="/admin/dashboard" class="logo"><span class="logo-text">SkillHub Admin</span></a>
    </nav>

    <div class="container">
        <a href="/admin/dashboard" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        <h1>Manage Categories</h1>

        <div class="grid">
            <!-- Add Category Form -->
            <div class="card">
                <h3>Add New Category</h3>
                <form th:action="@{/admin/categories/add}" method="post" th:object="${newCategory}">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" th:field="*{name}" placeholder="e.g. Data Science" required>
                    </div>
                    <div class="form-group">
                        <label>Icon Class (FontAwesome)</label>
                        <input type="text" th:field="*{icon}" placeholder="e.g. fas fa-chart-bar">
                        <small style="color: #6a6f73;">Optional. Default: fas fa-folder</small>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Category</button>

                    <div th:if="${success}" class="alert alert-success" style="margin-top: 1rem; color: green;">
                        <span th:text="${success}"></span>
                    </div>
                </form>
            </div>

            <!-- Existing Categories List -->
            <div class="card">
                <h3>Existing Categories</h3>
                <ul class="category-list">
                    <li th:each="cat : ${categories}" class="category-item">
                        <div>
                            <i th:class="${cat.icon}" style="width: 20px; color: #a435f0;"></i>
                            <span th:text="${cat.name}" style="font-weight: 600;">Category Name</span>
                        </div>
                        <span style="color: #6a6f73; font-size: 0.9rem;">ID: <span th:text="${cat.id}"></span></span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</body>

</html>
