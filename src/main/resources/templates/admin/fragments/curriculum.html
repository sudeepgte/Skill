<div th:fragment="curriculum_content" id="curriculum-content">
    <style>
        /* Scoped styles for curriculum fragment */
        .curr-section-details {
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            margin-bottom: 1rem;
            background: white;
            overflow: hidden;
        }

        .curr-section-summary {
            padding: 1rem;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            list-style: none;
        }

        .curr-section-summary::-webkit-details-marker {
            display: none;
        }

        .curr-section-content {
            padding: 1rem;
            border-top: 1px solid #e1e4e8;
        }

        .curr-lecture-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            border-bottom: 1px solid #eee;
            background: white;
            transition: background 0.2s;
        }

        .curr-lecture-item:hover {
            background: #f8f9fa;
        }

        .curr-lecture-item:last-child {
            border-bottom: none;
        }

        .curr-add-section-box {
            background: #f0f2f5;
            padding: 1.5rem;
            border: 2px dashed #d1d7dc;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>

    <div class="section-title">Course Curriculum</div>
    <div class="help-text" style="margin-bottom: 1.5rem;">Organize your course into sections and lectures.</div>

    <!-- Feedback Messages for AJAX -->
    <div id="curriculum-feedback" style="display:none; margin-bottom: 1rem; padding: 10px; border-radius: 4px;"></div>

    <!-- Add Section Form (Top Mechanism) -->
    <div class="curr-add-section-box">
        <h4 style="margin: 0 0 1rem 0; color: #6a6f73; font-size: 1rem;">Start by adding a new section</h4>
        <form th:action="@{/admin/curriculum/sections/add}" method="post"
            style="display: flex; gap: 10px; justify-content: center; max-width: 600px; margin: 0 auto;"
            onsubmit="return handleCurriculumAction(event, this);">
            <input type="hidden" name="courseId" th:value="${course.id}">
            <input type="text" name="title" class="form-control"
                placeholder="New Section Title (e.g. Introduction, Module 1)" required style="flex: 1;">
            <button type="submit" class="btn-submit" style="white-space: nowrap;">Add Section</button>
        </form>
    </div>

    <!-- List Sections (Accordion) -->
    <div th:each="section : ${course.sections}">
        <details class="curr-section-details" open>
            <summary class="curr-section-summary">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-chevron-right" style="color: #6a6f73; font-size: 0.8em;"></i>
                    <span style="font-size: 1.1rem;">
                        <i class="fas fa-folder-open" style="color: #6a6f73; margin-right: 8px;"></i>
                        <span th:text="${section.title}">Section Title</span>
                    </span>
                </div>

                <form th:action="@{/admin/curriculum/sections/delete}" method="post"
                    onsubmit="return confirm('Delete this section and all its lectures?') && handleCurriculumAction(event, this);"
                    style="margin: 0;">
                    <input type="hidden" name="sectionId" th:value="${section.id}">
                    <input type="hidden" name="courseId" th:value="${course.id}">
                    <button type="submit" title="Delete Section"
                        style="color: #dc3545; background: none; border: none; cursor: pointer; padding: 5px;">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </form>
            </summary>

            <div class="curr-section-content">
                <!-- Lecture List -->
                <div th:if="${not #lists.isEmpty(section.lectures)}"
                    style="border: 1px solid #e1e4e8; border-radius: 4px; margin-bottom: 1rem; overflow: hidden;">
                    <div th:each="lecture : ${section.lectures}" class="curr-lecture-item">
                        <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                            <i class="fas fa-play-circle" style="color: #a435f0;"></i>
                            <span th:text="${lecture.title}" style="font-weight: 500;">Lecture Title</span>
                            <span th:if="${lecture.preview}"
                                style="font-size: 0.75em; background: #e6fcf5; color: #0ca678; padding: 2px 8px; border-radius: 12px; font-weight: 600;">Free
                                Preview</span>
                        </div>

                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span style="color: #6a6f73; font-size: 0.9em; font-family: monospace;">
                                <span th:if="${lecture.durationSeconds != null}"
                                    th:with="mins=${lecture.durationSeconds / 60}, secs=${lecture.durationSeconds % 60}">
                                    <span th:text="${mins}">0</span>m <span th:text="${secs}">00</span>s
                                </span>
                            </span>

                            <form th:action="@{/admin/curriculum/lectures/delete}" method="post"
                                onsubmit="return handleCurriculumAction(event, this);" style="margin: 0;">
                                <input type="hidden" name="lectureId" th:value="${lecture.id}">
                                <input type="hidden" name="courseId" th:value="${course.id}">
                                <button type="submit"
                                    style="color: #6a6f73; background: none; border: none; cursor: pointer; padding: 2px;">
                                    <i class="fas fa-times"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(section.lectures)}"
                    style="text-align: center; color: #6a6f73; padding: 1rem; font-style: italic;">
                    No lectures yet. Add one below.
                </div>

                <!-- Add Lecture (Toggleable) -->
                <details style="margin-top: 10px; border: 1px dashed #d1d7dc; border-radius: 4px;">
                    <summary
                        style="padding: 10px; cursor: pointer; color: #2d2f31; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-plus-circle" style="color: #a435f0;"></i> Add Curriculum Item
                    </summary>
                    <div style="padding: 15px; background: #f8f9fa; border-top: 1px dashed #d1d7dc;">
                        <form th:action="@{/admin/curriculum/lectures/add}" method="post" enctype="multipart/form-data"
                            onsubmit="return handleCurriculumAction(event, this);">
                            <input type="hidden" name="courseId" th:value="${course.id}">
                            <input type="hidden" name="sectionId" th:value="${section.id}">

                            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 15px;">
                                <div>
                                    <label class="form-label" style="font-size: 0.9rem;">Lecture Title</label>
                                    <input type="text" name="title" class="form-control"
                                        placeholder="e.g. Introduction to Java" required>
                                </div>
                                <div>
                                    <label class="form-label" style="font-size: 0.9rem;">Settings</label>
                                    <label
                                        style="display: flex; align-items: center; padding: 10px; background: white; border: 1px solid #2d2f31; height: 43px; cursor: pointer;">
                                        <input type="checkbox" name="isPreview" style="margin-right: 8px;"> Enable Free
                                        Preview
                                    </label>
                                </div>
                            </div>

                            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                                <div style="flex: 1;">
                                    <label class="form-label" style="font-size: 0.9rem;">Duration (Minutes)</label>
                                    <input type="number" name="durationMinutes" class="form-control" placeholder="0"
                                        min="0" value="0">
                                </div>
                                <div style="flex: 1;">
                                    <label class="form-label" style="font-size: 0.9rem;">Duration (Seconds)</label>
                                    <input type="number" name="durationSeconds" class="form-control" placeholder="0"
                                        min="0" max="59" value="0">
                                </div>
                            </div>

                            <div style="margin-bottom: 15px;">
                                <label class="form-label" style="font-size: 0.9rem;">Content</label>
                                <div style="background: white; padding: 15px; border: 1px solid #ccc;">
                                    <div style="margin-bottom: 10px;">
                                        <label style="display:block; margin-bottom: 5px; font-size: 0.9rem;">Upload
                                            Video File:</label>
                                        <input type="file" name="videoFile" accept="video/*" class="form-control">
                                    </div>
                                    <div style="text-align: center; margin: 10px 0; color: #6a6f73; font-size: 0.8rem;">
                                        - OR -</div>
                                    <div>
                                        <label style="display:block; margin-bottom: 5px; font-size: 0.9rem;">YouTube
                                            URL:</label>
                                        <input type="text" name="youtubeUrl" class="form-control"
                                            placeholder="https://www.youtube.com/watch?v=...">
                                    </div>
                                </div>
                            </div>

                            <div style="text-align: right;">
                                <button type="submit" class="btn-submit"
                                    style="padding: 10px 20px; font-size: 0.9rem; background-color: #2d2f31;">Add
                                    Lecture</button>
                            </div>
                        </form>
                    </div>
                </details>
            </div>
        </details>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(course.sections)}" style="text-align: center; padding: 3rem; color: #6a6f73;">
        <i class="fas fa-layer-group" style="font-size: 3rem; margin-bottom: 1rem; color: #d1d7dc;"></i>
        <p>No sections yet. Use the form above to start building your curriculum.</p>
    </div>
</div>
