<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Change Password | SkillHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="../static/css/auth.css">
    <!-- Reusing auth.css for form styling -->
</head>

<body>

    <div class="container" style="padding: 4.8rem 0; max-width: 60rem;">
        <h1
            style="font-family: 'Playfair Display', serif; font-size: 3.2rem; margin-bottom: 2.4rem; border-bottom: 1px solid #d1d7dc; padding-bottom: 1.2rem;">
            Change Password</h1>

        <div th:if="${error}" class="alert alert-danger"
            style="color: #6a1f1d; background-color: #f7dddc; padding: 1.6rem; margin-bottom: 2.4rem;">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/change-password}" method="post">
            <div class="form-group" style="margin-bottom: 1.6rem;">
                <label style="display: block; font-weight: 700; margin-bottom: 0.8rem;">Current Password</label>
                <input type="password" name="currentPassword" class="form-control" required style="height: 4.8rem;">
            </div>

            <div class="form-group" style="margin-bottom: 1.6rem;">
                <label style="display: block; font-weight: 700; margin-bottom: 0.8rem;">New Password</label>
                <input type="password" name="newPassword" class="form-control" required style="height: 4.8rem;">
            </div>

            <div class="form-group" style="margin-bottom: 1.6rem;">
                <label style="display: block; font-weight: 700; margin-bottom: 0.8rem;">Confirm New Password</label>
                <input type="password" name="confirmPassword" class="form-control" required style="height: 4.8rem;">
            </div>

            <div style="margin-top: 3.2rem;">
                <button type="submit" class="btn btn-primary"
                    style="background-color: #2d2f31; font-weight: 700; padding: 1.2rem 2.4rem;">Change
                    Password</button>
                <a href="/profile" style="margin-left: 1.6rem; color: #5624d0;">Cancel</a>
            </div>
        </form>
    </div>

</body>

</html>
