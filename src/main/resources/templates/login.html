<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login | SkillHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair Display:wght@400;600;700;800&family=DM Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-purple: #A78BFA;
            --brand-pink: #8B5CF6;
            --brand-primary: linear-gradient(135deg, #A78BFA, #a29bfe);
            --form-bg: #f8faff;
            --text-dark: #1c1d1f;
            --text-muted: #6a6f73;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: url('/images/auth-page-bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* ─── AUTH CARD ─── */
        .auth-card {
            background: #fff;
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            display: flex;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        /* ─── LEFT SIDE (BRAND) ─── */
        .auth-brand-side {
            flex: 1.2;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('/images/welcome-bg.png');
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        /* Decorative Ornaments */
        .ornament {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }
        .o-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .o-2 { width: 200px; height: 200px; bottom: -50px; right: -50px; background: rgba(255, 255, 255, 0.05); }
        .o-3 { 
            width: 150px; height: 40px; 
            top: 20%; right: 10%; 
            background: rgba(255, 255, 255, 0.15); 
            border-radius: 20px; 
            transform: rotate(-35deg); 
        }

        .auth-brand-side h1 {
            font-family: 'Playfair Display', sans-serif;
            font-size: 4.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 2rem;
            position: relative;
            z-index: 2;
        }

        .auth-brand-side p {
            font-size: 1.8rem;
            line-height: 1.6;
            opacity: 0.9;
            max-width: 400px;
            position: relative;
            z-index: 2;
        }

        /* ─── RIGHT SIDE (FORM) ─── */
        .auth-form-side {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }

        .form-header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .form-header h2 {
            font-family: 'Playfair Display', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #4a4a4a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--brand-purple);
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            height: 44px;
            padding: 0 16px 0 45px;
            background: #f0f3ff;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: #fff;
            border-color: #d1d9ff;
            box-shadow: 0 6px 15px rgba(108, 92, 231, 0.08);
            outline: none;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-link:hover { color: var(--brand-purple); }

        .btn-login {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, #cc66ff, #A78BFA);
            color: #fff;
            border: none;
            border-radius: 22px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(108, 92, 231, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--brand-purple);
            font-weight: 700;
            text-decoration: none;
        }

        .alert {
            padding: 0.8rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            font-weight: 600;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 900px) {
            .auth-brand-side { display: none; }
            .auth-card { max-width: 500px; border-radius: 25px; }
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <!-- Decoration from screenshot 2 -->
        <div class="ornament o-1"></div>

        <div class="auth-brand-side" style="text-align: center; align-items: center;">
            <div class="ornament o-2"></div>
            <div class="ornament o-3"></div>
            <h1 style="margin-bottom: 0;">Welcome to SkillHub</h1>
        </div>

        <div class="auth-form-side">
            <div class="form-header">
                <h2>User Login</h2>
            </div>

            <!-- Alerts -->
            <div th:if="${error}" class="alert" style="color:#b32d2e; background:#fff2f2;" th:text="${error}">
                Invalid password reset token.
            </div>
            <div th:if="${param.error}" class="alert" style="color:#b32d2e; background:#fff2f2;">
                Invalid email or password.
            </div>
            <div th:if="${param.resetSuccess}" class="alert" style="color:#0f3e0f; background:#e9f7ef;">
                Password reset successfully! Please login with your new password.
            </div>
            <div th:if="${param.logout}" class="alert" style="color:#0f3e0f; background:#e9f7ef;">
                Successfully logged out.
            </div>
            <div th:if="${param.success}" class="alert" style="color:#0f3e0f; background:#e9f7ef;">
                Registration successful! Welcome aboard.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="input-group">
                    <i class="far fa-user"></i>
                    <input type="email" name="username" class="form-control" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" style="accent-color: var(--brand-purple);"> Remember
                    </label>
                    <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login">Login</button>

                <div class="auth-footer">
                    Don't have an account? <a href="/register">Sign up</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
