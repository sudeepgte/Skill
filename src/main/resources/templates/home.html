<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Learning | SkillHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/home" class="logo">
            <span class="logo-text">SkillHub</span>
        </a>

        <div class="nav-category">Categories</div>

        <div class="search-bar">
            <form action="#">
                <i class="fas fa-search search-icon"></i>
                <input type="text" placeholder="Search for anything">
            </form>
        </div>

        <div class="nav-links">
            <a href="#">My Learning</a>
            <a href="#"><i class="far fa-heart"></i></a>
            <a href="#"><i class="fas fa-shopping-cart"></i></a>
            <a href="#"><i class="far fa-bell"></i></a>

            <!-- User Avatar -->
            <span
                style="border-radius: 50%; background: #2d2f31; color: white; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700;"
                th:text="${#strings.substring(user.name,0,1)}">U</span>

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit"
                    style="background:none; border:none; cursor:pointer; margin-left:0.5rem; font-size:14px; text-decoration:underline;">Logout</button>
            </form>
        </div>
    </nav>

    <!-- Welcome Header -->
    <div style="background-color: #2d2f31; color: white; padding: 4rem 1rem; margin-bottom: 2rem;">
        <div class="section-container" style="margin: 0 auto; padding: 0;">
            <h1 th:text="'Welcome back, ' + ${user.name}" style="color: white; font-family: 'Merriweather', serif;">
                Welcome back, User</h1>
        </div>
    </div>

    <!-- Continue Learning -->
    <div class="section-container">
        <div class="section-header">
            <h2>Continue learning</h2>
        </div>
        <!-- Empty State -->
        <div
            style="background:#fff; height: 150px; display: flex; align-items: center; justify-content: center; border: 1px solid #d1d7dc; margin-bottom: 3rem; text-align: center;">
            <div>
                <p style="font-weight: 700; color: var(--text-main);">Prepare for your career in software development
                </p>
                <a href="/" style="color: var(--udemy-purple); font-weight: 700; text-decoration: none;">Browse
                    courses</a>
            </div>
        </div>
    </div>

    <!-- Recommended Carousel -->
    <div class="section-container">
        <div class="section-header">
            <h2>Recommended for you</h2>
        </div>

        <div class="course-carousel-wrapper">
            <button class="carousel-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
            <div class="course-carousel">
                <a th:each="course : ${courses}" th:href="@{/course/{id}(id=${course.id})}" class="course-card">
                    <div class="course-img-wrapper">
                        <img th:src="${course.imageUrl}" alt="Course">
                    </div>
                    <div class="course-info">
                        <h3 th:text="${course.title}">Course Title</h3>
                        <div class="course-instructor" th:text="${course.instructor}">Instructor</div>
                        <div class="rating">
                            <span class="score">4.6</span>
                            <div class="stars">
                                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i
                                    class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
                            </div>
                            <span class="reviews">(854)</span>
                        </div>
                        <div class="price" th:text="'$' + ${course.price}">$19.99</div>
                    </div>
                </a>
            </div>
            <button class="carousel-btn next-btn"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="logo-text" style="color: white; margin-bottom: 1rem;">SkillHub</div>
            <p>&copy; 2024 SkillHub, Inc.</p>
        </div>
    </footer>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
