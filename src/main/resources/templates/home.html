<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Learning | SkillHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/home" class="logo">
            <span class="logo-text">SkillHub</span>
        </a>

        <div class="categories-link">Categories</div>

        <div class="search-container">
            <button class="search-icon-btn"><i class="fas fa-search"></i></button>
            <form action="/home" style="width: 100%;">
                <input type="text" name="query" class="search-input" placeholder="Search for anything"
                    th:value="${searchQuery}">
            </form>
        </div>

        <div class="nav-actions">
            <!-- My Learning Link -->
            <a href="#" class="nav-link">My Learning</a>

            <!-- Icons -->
            <a href="#" class="btn btn-ghost btn-icon" style="font-size: 2rem;"><i class="far fa-heart"></i></a>
            <a href="#" class="btn btn-ghost btn-icon" style="font-size: 2rem;"><i class="fas fa-shopping-cart"></i></a>
            <a href="#" class="btn btn-ghost btn-icon" style="font-size: 2rem;"><i class="far fa-bell"></i></a>

            <!-- User Avatar -->
            <div
                style="width: 4rem; height: 4rem; background-color: var(--color-black); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700;">
                <span th:text="${#strings.substring(user.name,0,1)}">U</span>
            </div>

            <!-- Logout (simulated link/button) -->
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-ghost text-sm"
                    style="font-weight: 400; text-decoration: underline;">Logout</button>
            </form>
        </div>
    </nav>

    <!-- Welcome Header / Hero -->
    <!-- Logged in hero is simpler, black background -->
    <div style="background-color: var(--color-black); color: white; padding: 4.8rem 0;">
        <div class="container">
            <h1 style="color: white; font-family: 'Merriweather', serif; font-size: 3.2rem; margin-bottom: 0;"
                th:text="'Welcome back, ' + ${user.name}">Welcome back, User</h1>
        </div>
    </div>

    <!-- Tabs / Sections -->
    <div class="container" style="padding-top: 3.2rem; padding-bottom: 3.2rem;">

        <!-- Filter Pills -->
        <div class="tags-container">
            <a href="/home" class="tag-pill" th:classappend="${activeSection == null} ? 'active'">All Courses</a>
            <a th:each="section : ${sections}" th:href="@{/home(sectionId=${section.id})}" class="tag-pill"
                th:classappend="${activeSection == section.id} ? 'active'" th:text="${section.name}">Development</a>
        </div>

        <!-- Section Title -->
        <div class="section-headline">
            <span th:if="${activeSection == null}">Let's start learning</span>
            <span th:if="${activeSection != null}">Category: <span th:text="${activeSection}"></span></span>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(courses)}"
            style="text-align: center; padding: 6.4rem 0; background-color: var(--color-gray-100); border: 1px solid var(--color-gray-200); margin-bottom: 4.8rem;">
            <p class="text-bold" style="font-size: 1.9rem; margin-bottom: 1.6rem;">No courses found in this section.</p>
            <a href="/home" class="btn btn-primary">Browse all courses</a>
        </div>

        <!-- Course Grid -->
        <div class="course-grid">
            <a th:each="course : ${courses}" th:href="@{/course/{id}(id=${course.id})}" class="course-card">
                <div class="course-image">
                    <img th:src="${course.imageUrl}" alt="Course">
                </div>
                <h3 class="course-title" th:text="${course.title}">Course Title</h3>
                <div class="course-author" th:text="${course.instructor}">Instructor</div>

                <!-- Progress bar simulation for logged in user? (Optional) -->
                <!-- <div style="width: 100%; height: 4px; background: #d1d7dc; margin-bottom: 0.8rem;"><div style="width: 40%; height: 100%; background: #a435f0;"></div></div> -->

                <div class="course-rating">
                    <span class="rating-number">4.7</span>
                    <div class="rating-stars">
                        <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i
                            class="fas fa-star"></i><i class="fas fa-star-half-alt"></i>
                    </div>
                </div>
                <!-- Note: Logged in "My Learning" usually doesn't show price, but if this is "Recommended", it does. 
                      Assuming this is 'Browse' or 'Recommended' view for now based on context. 
                  -->
                <div class="course-price" th:text="'₹' + ${course.price}">₹499</div>
            </a>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-logo">SkillHub</div>
            <p class="footer-copyright">&copy; 2024 SkillHub, Inc.</p>
        </div>
    </footer>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
