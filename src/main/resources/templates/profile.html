<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Profile | SkillHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        :root {
            --primary: #a435f0;
            --dark: #1c1d1f;
            --light: #f7f9fa;
            --border: #d1d7dc;
            --text: #2d2f31;
            --muted: #6a6f73;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            color: var(--text);
            margin: 0;
        }

        .profile-container {
            max-width: 1200px;
            margin: 2rem auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            padding: 0 1rem;
        }

        @media (max-width: 768px) {
            .profile-container {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            height: fit-content;
        }

        .user-info {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar-lg {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--dark);
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            padding: 0.8rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-size: 1rem;
        }

        .nav-item:hover {
            background: var(--light);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .content-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-save {
            background: var(--dark);
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
        }

        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .cert-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
        }

        .cert-card i {
            font-size: 2rem;
            color: #ff9800;
        }

        .alert {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
        }

        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>

<body>

    <nav style="background: white; border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;">
        <a href="/user/home" style="text-decoration:none; color:var(--dark); font-weight:800; font-size:1.5rem;">SkillHub</a>
        <div style="display: flex; gap: 1.5rem; align-items: center;">
            <a href="/student/dashboard" style="text-decoration:none; color:var(--text); font-weight:600;">Back to Dashboard</a>
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--dark); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700;" th:text="${#strings.substring(user.name, 0, 1)}">U</div>
        </div>
    </nav>

    <div class="profile-container">
        <aside class="sidebar">
            <div class="user-info">
                <div class="avatar-lg" th:text="${#strings.substring(user.name, 0, 1)}">U</div>
                <h3 th:text="${user.name}">User Name</h3>
                <p style="color: var(--muted); font-size: 0.9rem;" th:text="${user.role}">Role</p>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="profile">
                    <i class="fas fa-user-circle"></i> View Profile
                </button>
                <button class="nav-item" data-tab="certificates">
                    <i class="fas fa-certificate"></i> My Certificates
                </button>
                <button class="nav-item" data-tab="security">
                    <i class="fas fa-lock"></i> Security
                </button>
                <form th:action="@{/logout}" method="post" style="width:100%;">
                    <button type="submit" class="nav-item" style="color: #d32f2f;">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </form>
            </nav>
        </aside>

        <main class="content-card">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <!-- Profile Tab -->
            <div id="profile" class="tab-content active">
                <h2 style="margin-top: 0;">Profile Information</h2>
                <form th:action="@{/profile}" method="post">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="name" th:value="${user.name}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" th:value="${user.email}" class="form-control" readonly style="background:#f0f2f5;">
                        <small style="color:var(--muted);">Email cannot be changed.</small>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" name="phone" th:value="${user.phone}" class="form-control" placeholder="+1 234 567 890">
                    </div>
                    <div class="form-group">
                        <label>Headline</label>
                        <input type="text" name="headline" th:value="${user.headline}" class="form-control" placeholder="e.g. Software Engineer Student">
                    </div>
                    <div class="form-group">
                        <label>Skills (Comma separated)</label>
                        <input type="text" name="skills" th:value="${user.skills}" class="form-control" placeholder="Java, Spring Boot, React...">
                    </div>
                    <div class="form-group">
                        <label>Biography</label>
                        <textarea name="bio" class="form-control" rows="4" th:text="${user.bio}" placeholder="Tell us about yourself..."></textarea>
                    </div>
                    <button type="submit" class="btn-save">Save Changes</button>
                </form>
            </div>

            <!-- Certificates Tab -->
            <div id="certificates" class="tab-content">
                <h2 style="margin-top: 0;">My Certificates</h2>
                <p th:if="${#lists.isEmpty(certificates)}" style="color: var(--muted);">Complete a course exam to earn certificates.</p>
                <div class="cert-grid">
                    <div th:each="cert : ${certificates}" class="cert-card">
                        <i class="fas fa-award"></i>
                        <div>
                            <h4 style="margin: 0;" th:text="${cert.course.title}">Course Title</h4>
                            <p style="font-size: 0.8rem; color: var(--muted); margin: 0.5rem 0;">Completed on: <span th:text="${#temporals.format(cert.certificateDate, 'dd MMM yyyy')}">Date</span></p>
                        </div>
                        <a href="#" style="color: var(--primary); font-weight: 700; text-decoration:none; font-size: 0.9rem;">View Certificate</a>
                    </div>
                </div>
            </div>

            <!-- Security Tab -->
            <div id="security" class="tab-content">
                <h2 style="margin-top: 0;">Password & Security</h2>
                <form th:action="@{/change-password}" method="post">
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" name="currentPassword" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" name="newPassword" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" name="confirmPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="btn-save">Update Password</button>
                </form>
            </div>
        </main>
    </div>

    <script th:inline="javascript">
        document.querySelectorAll('.nav-item[data-tab]').forEach(button => {
            button.addEventListener('click', () => {
                const tabId = button.getAttribute('data-tab');
                
                // Update buttons
                document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                // Update content
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
            });
        });

        // Initialize from URL or default
        const activeTab = /*[[${activeTab}]]*/ 'profile';
        if(activeTab) {
            const btn = document.querySelector(`.nav-item[data-tab="${activeTab}"]`);
            if(btn) btn.click();
        }
    </script>
</body>
</html>
