<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <nav th:fragment="navbar" class="navbar">
        <!-- Logo -->
        <a th:href="${user != null} ? '/user/home' : '/'" class="nav-logo">SkillHub</a>

        <!-- Categories Dropdown -->
        <div class="nav-dropdown">
            <div class="nav-dropdown-trigger">
                Categories <i class="fas fa-chevron-down" style="font-size:1rem;"></i>
            </div>
            <div class="nav-dropdown-menu">
                <!-- Check if categories list null -->
                <th:block th:if="${categories != null}">
                    <a th:each="cat : ${categories}"
                        th:href="${user != null} ? @{/user/home(categoryId=${cat.id})} : @{/(categoryId=${cat.id})}"
                        class="nav-dropdown-item">
                        <span th:text="${cat.name}">Category</span>
                        <i class="fas fa-chevron-right" style="font-size:1rem;opacity:0.45;"></i>
                    </a>
                </th:block>
            </div>
        </div>

        <!-- Search -->
        <div class="nav-search">
            <button class="nav-search-icon"><i class="fas fa-search"></i></button>
            <form th:action="${user != null} ? '/user/home' : '/'">
                <input type="text" name="query" placeholder="Search for anything" th:value="${searchQuery}">
            </form>
        </div>

        <!-- Right side -->
        <div class="nav-right">
            <!-- New Global Links -->
            <a href="/about" class="nav-link">About</a>
            <a href="/contact" class="nav-link">Contact</a>

            <th:block th:if="${user != null}">
                <a href="/profile?tab=courses" class="nav-link">My Course</a>
                <a href="/user/certifications" class="nav-link">Exams</a>

                <!-- Icons -->
                <a href="/student/wishlist" class="nav-icon" title="Wishlist"><i class="far fa-heart"></i></a>
                <a href="/notifications" class="nav-icon" title="Notifications"><i class="far fa-bell"></i></a>

                <!-- User Avatar Dropdown -->
                <div class="nav-user-dropdown">
                    <a href="/profile" class="nav-avatar">
                        <img th:if="${user.profileImageUrl != null}" th:src="${user.profileImageUrl}"
                            style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                        <span th:if="${user.profileImageUrl == null}"
                            th:text="${#strings.substring(user.name,0,1)}">U</span>
                    </a>
                    <div class="nav-user-menu">
                        <div class="nav-user-menu-header">
                            <div class="name" th:text="${user.name}">User Name</div>
                            <div class="email" th:text="${user.email}">user@example.com</div>
                        </div>
                        <a href="/profile">My Profile</a>
                        <a href="/user/home">My Courses</a>
                        <a href="/profile?tab=security">Change Password</a>
                        <div class="nav-user-menu-divider"></div>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit">Logout</button>
                        </form>
                    </div>
                </div>
            </th:block>

            <!-- Guest state -->
            <th:block th:unless="${user != null}">
                <a href="/login" class="nav-btn-outline">Log in</a>
                <a href="/register" class="nav-btn-primary">Sign up</a>
            </th:block>

            <button class="nav-globe"><i class="fas fa-globe"></i></button>
        </div>
    </nav>
</body>

</html>
