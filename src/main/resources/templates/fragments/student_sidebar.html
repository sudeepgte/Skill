<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style th:fragment="student-sidebar-styles">
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        /* ━━ VENDOR DASHBOARD PALETTE ━━ */
        :root {
            --vendor-sidebar-bg: #2E1065;
            --vendor-sidebar-active: #8B5CF6;
            --vendor-content-bg: #F5F3FF;
            --vendor-primary: #8B5CF6;
            --vendor-primary-hover: #7C3AED;
            --vendor-text-main: #2E1065;
            --vendor-text-muted: #8B5CF6;
            --vendor-card-border: rgba(167, 139, 250, 0.25);
            --vendor-status-published: #EDE9FE;
            --vendor-status-published-text: #2E1065;
            --vendor-accent: #C4B5FD;
            --vendor-highlight: #EC4899;
        }

        body {
            font-family: 'Poppins', 'Plus Jakarta Sans', sans-serif !important;
            background-color: var(--vendor-content-bg) !important;
            margin: 0 !important;
            padding: 0 !important;
            min-height: 100vh;
        }

        .student-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
            margin: 0 !important;
            padding: 0 !important;
            max-width: 100% !important;
            box-sizing: border-box;
            background-color: var(--vendor-content-bg);
        }

        /* ━━ SIDEBAR (EXACT PIXEL-PERFECT MEASUREMENTS TO MATCH PROFILE & WISHLIST) ━━ */
        .student-sidebar {
            width: 260px !important;
            min-width: 260px !important;
            max-width: 260px !important;
            background-color: var(--vendor-sidebar-bg) !important; /* #2E1065 */
            color: white !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 15px 0 20px 0 !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            bottom: 0 !important;
            z-index: 1000 !important;
            height: 100vh !important;
            overflow-y: auto !important;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
            border-right: 1px solid rgba(167, 139, 250, 0.15) !important;
            box-sizing: border-box !important;
            flex-shrink: 0 !important;
            box-shadow: 4px 0 24px rgba(46, 16, 101, 0.08) !important;
        }

        .student-sidebar::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        /* Sidebar Brand & Logo Header */
        .sidebar-brand-wrapper {
            padding: 4px 16px 14px !important;
            border-bottom: 1px solid rgba(167, 139, 250, 0.18) !important;
            margin-bottom: 12px !important;
            box-sizing: border-box !important;
        }

        .sidebar-brand-wrapper .nav-logo {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            text-decoration: none !important;
            margin: 0 !important;
        }

        .sidebar-brand-wrapper .logo-wrapper {
            display: flex !important;
            flex-direction: column !important;
        }

        .sidebar-brand-wrapper .logo-main {
            font-family: 'Inter', sans-serif !important;
            font-size: 24px !important;
            font-weight: 900 !important;
            letter-spacing: -1px !important;
            text-transform: none !important;
            line-height: 1 !important;
        }

        .sidebar-brand-wrapper .skill-text {
            color: #0A54B3 !important;
        }

        .sidebar-brand-wrapper .hub-text {
            color: #00BFA5 !important;
        }

        .sidebar-brand-wrapper .logo-tagline {
            font-family: 'Inter', sans-serif !important;
            font-size: 8.5px !important;
            font-weight: 700 !important;
            color: #A78BFA !important;
            text-transform: uppercase !important;
            letter-spacing: 1.5px !important;
            margin-top: 2px !important;
        }

        /* User Info Card in Sidebar */
        .student-user-info {
            padding: 14px 12px 16px !important;
            text-align: center !important;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%) !important;
            border: 1px solid rgba(167, 139, 250, 0.18) !important;
            border-radius: 14px !important;
            margin: 0 10px 14px !important;
            box-sizing: border-box !important;
        }

        .student-avatar-large {
            width: 72px !important;
            height: 72px !important;
            background: #3B137E !important;
            color: #fff !important;
            border-radius: 50% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 28px !important;
            font-weight: 700 !important;
            margin: 0 auto 12px !important;
            text-decoration: none !important;
            position: relative !important;
            border: 3px solid #8B5CF6 !important;
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.35) !important;
            overflow: hidden !important;
        }

        .student-user-info h3 {
            margin: 0 !important;
            font-size: 16px !important;
            font-weight: 700 !important;
            color: #ffffff !important;
            line-height: 1.3 !important;
        }

        .student-user-info p {
            margin: 3px 0 0 !important;
            color: #C4B5FD !important;
            font-size: 12px !important;
            line-height: 1.3 !important;
        }

        .student-xp-level {
            font-size: 11.5px !important;
            font-weight: 700 !important;
            color: #EDE9FE !important;
            background: rgba(139, 92, 246, 0.25) !important;
            border: 1px solid rgba(167, 139, 250, 0.35) !important;
            padding: 2.5px 9px !important;
            border-radius: 20px !important;
            margin-top: 6px !important;
            display: inline-block !important;
        }

        .student-badges-container {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 6px !important;
            justify-content: center !important;
            margin-top: 10px !important;
            padding: 0 5px !important;
        }

        .student-badge-icon {
            width: 28px !important;
            height: 28px !important;
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1.5px solid #F59E0B !important;
            border-radius: 50% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            color: #FBBF24 !important;
            font-size: 12px !important;
            cursor: help !important;
        }

        /* Sidebar Nav Menu */
        .student-nav-menu {
            display: flex !important;
            flex-direction: column !important;
            gap: 3.5px !important;
            padding: 0 8px !important;
            box-sizing: border-box !important;
        }

        .student-section-title {
            font-size: 10.5px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.8px !important;
            color: #A78BFA !important;
            padding: 8px 10px 3px !important;
            margin-top: 2px !important;
            line-height: 1.2 !important;
        }

        .student-section-divider {
            border-top: 1px solid rgba(167, 139, 250, 0.18) !important;
            margin: 7px 4px 3px !important;
        }

        .student-nav-item {
            display: flex !important;
            align-items: center !important;
            gap: 8.5px !important;
            padding: 8.5px 11px !important;
            border: none !important;
            background: none !important;
            width: 100% !important;
            text-align: left !important;
            cursor: pointer !important;
            font-size: 13.5px !important;
            font-weight: 500 !important;
            color: #F5F3FF !important;
            text-decoration: none !important;
            box-sizing: border-box !important;
            border-radius: 10px !important;
            transition: all 0.18s ease !important;
            font-family: inherit !important;
            line-height: 1.4 !important;
        }

        .student-nav-item:hover {
            background-color: rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important;
            text-decoration: none !important;
        }

        .student-nav-item.active {
            background-color: var(--vendor-sidebar-active) !important;
            color: #ffffff !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35) !important;
        }

        .student-nav-item i {
            width: 22px !important;
            text-align: center !important;
            font-size: 14px !important;
            flex-shrink: 0 !important;
            color: #C4B5FD !important;
            transition: color 0.18s ease !important;
        }

        .student-nav-item:hover i,
        .student-nav-item.active i {
            color: #ffffff !important;
        }

        .student-sidebar-badge {
            background: #EC4899 !important;
            color: #fff !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            min-width: 20px !important;
            height: 20px !important;
            border-radius: 999px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 0 7px !important;
            line-height: 1 !important;
            box-shadow: 0 2px 6px rgba(236, 72, 153, 0.4) !important;
        }

        /* ━━ MAIN CONTENT (RIGHT SIDE OF SIDEBAR, 100% FULL-SCREEN FIT) ━━ */
        .student-main-content {
            flex: 1 !important;
            margin-left: 260px !important;
            width: calc(100% - 260px) !important;
            max-width: calc(100% - 260px) !important;
            min-height: 100vh !important;
            background-color: var(--vendor-content-bg) !important;
            box-sizing: border-box !important;
            padding: 2.5rem 3.5rem 4rem !important;
        }

        @media (max-width: 768px) {
            .student-sidebar {
                display: none !important;
            }
            .student-main-content {
                margin-left: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 1.5rem !important;
            }
        }
    </style>
</head>
<body>
    <aside th:fragment="student-sidebar(activePage)" class="student-sidebar">
        <!-- Brand / Logo Header -->
        <div class="sidebar-brand-wrapper">
            <a th:href="'/'" class="nav-logo">
                <img th:src="@{/images/icon.png?v=2.2}" alt="SkillHub Icon" class="logo-icon" style="height: 34px;">
                <div class="logo-wrapper">
                    <div class="logo-main"><span class="skill-text">Skill</span><span class="hub-text">Hub</span></div>
                    <div class="logo-tagline">Learn.Grow.Succeed</div>
                </div>
            </a>
        </div>

        <!-- User Info Card -->
        <div class="student-user-info" th:if="${user != null}">
            <a th:href="@{/profile?tab=profile}" class="student-avatar-large" title="Go to Profile">
                <img th:if="${user.profileImageUrl != null}" th:src="${user.profileImageUrl}"
                    style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                <span th:if="${user.profileImageUrl == null}"
                    th:text="${#strings.substring(user.name,0,1)}">U</span>
            </a>
            <h3 th:text="${user.name}">User Name</h3>
            <p th:text="${user.headline ?: 'SkillHub Learner'}">Headline</p>
            <div class="student-xp-level" th:text="|Level ${user.level}|">Level 1</div>

            <div class="student-badges-container" th:if="${!#strings.isEmpty(user.badges)}">
                <div th:each="badge : ${user.getBadgesList()}" class="student-badge-icon" th:title="${badge}">
                    <i class="fas fa-trophy"></i>
                </div>
            </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="student-nav-menu">
            <!-- Section 1: Profile & Learning Tabs -->
            <div class="student-section-title">Profile & Learning</div>
            <a href="/profile?tab=documents" class="student-nav-item" th:classappend="${activePage == 'documents' ? 'active' : ''}">
                <i class="fas fa-file-alt"></i> <span>My Documents</span>
            </a>
            <a href="/profile?tab=profile" class="student-nav-item" th:classappend="${activePage == 'profile' ? 'active' : ''}">
                <i class="fas fa-user-circle"></i> <span>Edit Profile</span>
            </a>
            <a href="/profile?tab=courses" class="student-nav-item" th:classappend="${activePage == 'courses' ? 'active' : ''}">
                <i class="fas fa-book-reader"></i> <span>My Courses</span>
            </a>
            <a href="/profile?tab=creations" class="student-nav-item" th:classappend="${activePage == 'creations' ? 'active' : ''}">
                <i class="fas fa-images"></i> <span>My Creations</span>
            </a>
            <a href="/profile?tab=certificates" class="student-nav-item" th:classappend="${activePage == 'certificates' ? 'active' : ''}">
                <i class="fas fa-award"></i> <span>Certificates</span>
            </a>
            <a href="/profile?tab=notes" class="student-nav-item" th:classappend="${activePage == 'notes' ? 'active' : ''}">
                <i class="fas fa-sticky-note"></i> <span>My Notes</span>
            </a>
            <a href="/profile?tab=messages" class="student-nav-item" th:classappend="${activePage == 'messages' ? 'active' : ''}">
                <i class="fas fa-comment-dots"></i> <span>Messages</span>
            </a>
            <a href="/profile?tab=security" class="student-nav-item" th:classappend="${activePage == 'security' ? 'active' : ''}">
                <i class="fas fa-key"></i> <span>Security</span>
            </a>

            <!-- Section 2: Explore & Navigation -->
            <div class="student-section-divider"></div>
            <div class="student-section-title">Explore & Navigation</div>

            <a href="/user/certifications" class="student-nav-item" th:classappend="${activePage == 'exams' ? 'active' : ''}">
                <i class="fas fa-graduation-cap"></i> <span>Exams</span>
            </a>

            <a href="/student/professional-exams" class="student-nav-item" th:classappend="${activePage == 'professional-exams' ? 'active' : ''}">
                <i class="fas fa-user-graduate"></i> <span>Professional Exams</span>
            </a>

            <a href="/student/wishlist" class="student-nav-item" th:classappend="${activePage == 'wishlist' ? 'active' : ''}" style="justify-content: space-between;">
                <span style="display: flex; align-items: center; gap: 12px;">
                    <i class="far fa-heart"></i> <span>Wishlist</span>
                </span>
                <span id="wishlistBadge" th:if="${wishlistCount != null and wishlistCount > 0}" 
                      th:text="${wishlistCount}" class="student-sidebar-badge">0</span>
            </a>

            <a href="/notifications" class="student-nav-item" th:classappend="${activePage == 'notifications' ? 'active' : ''}" style="justify-content: space-between;">
                <span style="display: flex; align-items: center; gap: 12px;">
                    <i class="far fa-bell"></i> <span>Notifications</span>
                </span>
                <span id="navNotificationBadge" th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}" 
                      th:text="${unreadNotificationCount}" class="student-sidebar-badge">0</span>
            </a>

            <!-- Section 3: Account Actions -->
            <div class="student-section-divider"></div>
            <form th:action="@{/logout}" method="post" style="width:100%; margin: 0;">
                <button type="submit" class="student-nav-item" style="color: #F87171;">
                    <i class="fas fa-sign-out-alt" style="color: #F87171;"></i> <span>Logout</span>
                </button>
            </form>
        </nav>
    </aside>
    <!-- SkillHub Global Broadcast Popup Notification -->
    <script th:src="@{/js/broadcast-popup.js}" src="/js/broadcast-popup.js" defer></script>
</body>
</html>
