<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Sign Up | SkillHub</title>
    <!-- Use style.css -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
    <link rel="stylesheet" th:href="@{/css/navbar.css}" href="../static/css/navbar.css">
    <link rel="stylesheet" th:href="@{/css/footer.css}" href="../static/css/footer.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="../static/css/auth.css">
</head>

<body>

    <!-- Navbar (Full) -->
    <nav class="navbar">
        <div class="navbar-left">
            <a href="/" class="logo">
                <span class="logo-text">SkillHub</span>
            </a>
            <div class="dropdown">
                <div class="categories-link">Categories <i class="fas fa-chevron-down"
                        style="font-size: 1.2rem; margin-left: 0.4rem;"></i></div>
                <div class="dropdown-menu">
                    <a th:each="cat : ${categories}" th:href="@{/(categoryId=${cat.id})}" class="dropdown-item">
                        <span th:text="${cat.name}">Category</span>
                        <i class="fas fa-chevron-right" style="font-size: 1.2rem; opacity: 0.5;"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="navbar-center">
            <div class="search-container">
                <button class="search-icon-btn"><i class="fas fa-search"></i></button>
                <form action="/" style="width: 100%;">
                    <input type="text" name="query" class="search-input" placeholder="Search for anything">
                </form>
            </div>
        </div>

        <div class="navbar-right">
            <div style="display: flex; align-items: center; gap: 1.2rem;">
                <a href="/login" class="btn btn-outline btn-sm">Log in</a>
                <a href="/register" class="btn btn-primary btn-sm">Sign up</a>
            </div>
            <a href="#" class="btn btn-outline btn-icon"
                style="width: 4rem; height: 4rem; padding: 0; border: 1px solid var(--color-black);">
                <i class="fas fa-globe"></i>
            </a>
        </div>
    </nav>

    <div class="auth-page-container" style="min-height: 60vh;">
        <div class="container auth-split-container">
            <!-- Left: Illustration -->
            <div class="auth-illustration">
                <img src="https://frontends.udemycdn.com/components/auth/desktop-illustration-step-1-x1.webp"
                    alt="Sign up to SkillHub" style="max-width: 380px;">
            </div>

            <!-- Right: Form -->
            <div class="auth-form-side">
                <h3 class="auth-header" th:text="${isAdmin} ? 'Admin Sign Up' : 'Sign up and start learning'">Sign up
                    and start learning</h3>

                <form th:action="@{/saveUser}" th:object="${user}" method="post">
                    <div class="form-group">
                        <input type="text" th:field="*{name}" class="form-control" placeholder="Full Name" required>
                    </div>

                    <div class="form-group">
                        <input type="email" th:field="*{email}" class="form-control" placeholder="Email" required>
                    </div>

                    <div class="form-group">
                        <input type="password" th:field="*{password}" class="form-control" placeholder="Password"
                            required>
                    </div>

                    <!-- Hidden Role always set to STUDENT -->
                    <input type="hidden" name="role" value="STUDENT">

                    <!-- Admin check remains for hidden manual override from controller if needed, 
                         but strictly user requested: "All users should be registered as STUDENT by default." -->

                    <!-- Visual Checkbox from reference -->

                    <!-- Visual Checkbox from reference -->
                    <div style="display: flex; gap: 0.8rem; margin-bottom: 1.6rem; align-items: flex-start;">
                        <input type="checkbox" style="margin-top: 0.4rem; accent-color: var(--color-primary);">
                        <span class="text-xs" style="color: var(--color-text-main);">Send me special offers,
                            personalized recommendations, and learning tips.</span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Sign up</button>

                    <div
                        style="font-size: 1.2rem; text-align: center; margin-top: 1.2rem; color: var(--color-text-secondary);">
                        <div class="footer-link-col"></div>
                    </div>

                    <div style="margin-top: 2.4rem; text-align: center; font-size: 1.5rem;">
                        Already have an account? <a href="/login"
                            style="color: var(--color-primary); font-weight: 700; text-decoration: underline;">Log
                            in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="simple-footer">
        <div class="container footer-simple-content">
            <a href="/about" class="footer-simple-link">About Us</a>
            <a href="/contact" class="footer-simple-link">Contact Us</a>
            <a href="/terms" class="footer-simple-link">Terms</a>
            <a href="/privacy" class="footer-simple-link">Privacy Policy</a>
        </div>
        <div class="container">
            <div class="footer-copyright">&copy; 2024 SkillHub, Inc.</div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dropdowns = document.querySelectorAll('.dropdown');
            dropdowns.forEach(dropdown => {
                const trigger = dropdown.querySelector('.categories-link') || dropdown.querySelector('.dropdown-toggle');
                const menu = dropdown.querySelector('.dropdown-menu');
                if (!trigger || !menu) return;
                dropdown.addEventListener('mouseenter', () => { menu.style.display = 'block'; });
                dropdown.addEventListener('mouseleave', () => { menu.style.display = 'none'; });
            });
        });
    </script>

</body>

</html>
