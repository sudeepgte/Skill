# ==============================================================================
# SkillHub Elite - Production Configuration Profile (application-prod.properties)
# ==============================================================================

# Server & Reverse Proxy Hardening
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.protocol-header-https-value=https

# Error Handling (Zero Stacktrace / Internal Leakage)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Production Database (MySQL with HikariCP Optimization)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1200000}
spring.datasource.hikari.pool-name=SkillHubHikariPool
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000

# Production JPA / Hibernate (Strict validation, no runtime schema mutation)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Production Email (SMTP)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Production Razorpay Credentials
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# Production JWT Configuration
skillhub.app.jwtSecret=${JWT_SECRET}
skillhub.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Google Gemini AI Key
gemini.api.key=${GEMINI_API_KEY}

# Production Code Execution Sandbox
skillhub.code-execution.mode=${CODE_EXECUTION_MODE:production}
skillhub.code-execution.runner-url=${CODING_RUNNER_URL}
skillhub.code-execution.runner-secret=${CODING_RUNNER_SECRET}
skillhub.code-execution.max-submissions-per-question=10
skillhub.code-execution.submission-cooldown-seconds=5

# Production File Upload Storage
file.upload-dir=${UPLOAD_DIR:/var/skillhub/uploads}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Thymeleaf Template Caching Enabled for High Performance
spring.thymeleaf.cache=true

# Production Session & Cookie Hardening
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Production Logging with Correlation ID
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n
logging.level.root=WARN
logging.level.com.skillhub=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
