# Production Environment Configuration for SkillHub Elite

# Server Configuration
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# Production Database (MySQL with HikariCP Optimization)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=SkillHubHikariPool

# Production JPA / Hibernate (Strict validation, no runtime mutation)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Production Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Production Razorpay Credentials
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Production Code Execution Sandbox
skillhub.code-execution.mode=production
skillhub.code-execution.runner-url=${CODING_RUNNER_URL}
skillhub.code-execution.runner-secret=${CODING_RUNNER_SECRET}
skillhub.code-execution.max-submissions-per-question=10
skillhub.code-execution.submission-cooldown-seconds=5

# Production Logging (Structured, no debug outputs)
logging.level.root=WARN
logging.level.com.skillhub=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
