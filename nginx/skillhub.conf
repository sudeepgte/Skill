# ==============================================================================
# SkillHub Elite - Production Nginx Reverse Proxy Configuration
# Handles HTTPS termination, HTTP/2, WebSocket STOMP upgrade, and buffer limits
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream application cluster
upstream skillhub_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name skillhub.example.com;

    # ACME Challenge for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Secure Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skillhub.example.com;

    # SSL Certificates (managed via Certbot or custom certs)
    ssl_certificate /etc/letsencrypt/live/skillhub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillhub.example.com/privkey.pem;

    # Modern TLS Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max File Upload Limit (matching Spring Boot 100MB cap)
    client_max_body_size 100M;
    client_body_buffer_size 1M;

    # --------------------------------------------------------------------------
    # WebSocket STOMP Endpoint Proxying (/ws/**)
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://skillhub_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Sensitive Auth Endpoints Rate Limiting
    # --------------------------------------------------------------------------
    location ~* ^/(login|api/auth/login|register|forgot-password|reset-password)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://skillhub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # --------------------------------------------------------------------------
    # General Application Routing
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://skillhub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
